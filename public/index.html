function bedSort(a,b){return String(a.bed).localeCompare(String(b.bed),undefined,{numeric:true});}
function rnPts(){var ps=activeOf(S.rn.sid).filter(function(p){return !p.rnx;}).sort(bedSort);if(S.rn.ord==='desc')ps.reverse();return ps;}
function pTasksAll(p){
  return openTasks(p.id).map(function(t){return {id:t.id,text:t.text,r:!!t.r,k:'t'};}).concat(openICs(p.id).map(function(e){return {id:e.id,text:'Interconsulta '+(e.data.serv||'')+': '+cut(e.data.preg,140),r:false,k:'ic'};}));
}
function rnSecs(p,mode){
  var es=pEntries(p.id),ev=lastEv(p.id),ing=es.filter(function(e){return e.type==='ingreso';})[0],hx=p.hx||{},L=mode==='long';
  var ia=ing?ing.data:{},sx=p.sex==='F'?'femenina':'masculina';
  var res=ev&&ev.data.a?ev.data.a:(ia.imp||hx.dx||'');
  var plan=ev&&ev.data.p?ev.data.p:(ia.plan||hx.plan||'');
  var secs=[],N=L?700:260;
  secs.push(['Presentación',p.ini+', '+(p.age?p.age+' años, ':'')+sx+', cama '+(p.bed||'—')+', día '+hd(p)+' de hospitalización'+(p.dx?', con diagnóstico de '+p.dx:'')+'.']);
  if(L){
    var mo=ia.motivo||hx.motivo,an=ia.ant||hx.ant,ea=ia.ea||hx.ea;
    if(mo)secs.push(['Motivo de consulta',cut(mo,400)]);
    if(an)secs.push(['Antecedentes',cut(an,600)]);
    if(ea)secs.push(['Enfermedad actual',cut(ea,700)]);
  }
  if(res)secs.push([ev?'Estado actual (análisis del '+dlong(ev.at)+')':'Impresión diagnóstica',cut(res,N)]);
  if(L&&ev){
    if(ev.data.s)secs.push(['Subjetivo',cut(ev.data.s,400)]);
    if(ev.data.o)secs.push(['Objetivo y signos vitales',cut(ev.data.o,700)]);
  }
  if(plan)secs.push(['Plan',cut(plan,N)]);
  if(L){
    var lab=ofType(p,'lab')[0];
    if(lab&&lab.data.res)secs.push(['Paraclínicos ('+dlong(lab.at)+')',cut(lab.data.res,600)]);
    var tr=TRENDS.map(function(T){return trendRow(p,T);}).filter(Boolean).map(function(t){return t.txt;});
    if(tr.length)secs.push(['Tendencias',tr.join('\n')]);
    var im=ofType(p,'img')[0];
    if(im&&(im.data.lec||im.data.mia||im.data.lecNo||(im.data.rd&&im.data.rd.length)))secs.push(['Imágenes ('+dlong(im.at)+')',cut(imgPlain(im),600)]);
    var icr=ofType(p,'interconsulta').filter(function(e){return e.status==='respondida'&&e.data.resp;})[0];
    if(icr)secs.push(['Última interconsulta respondida',cut((icr.data.serv||'')+': '+icr.data.resp,400)]);
  }
  if(p.cont)secs.push(['Si pasa X, hacer Y',cut(p.cont,L?400:200)]);
  return secs;
}
function rnText(p,mode){
  var o=['Cama '+(p.bed||'—')+' · '+p.ini+' · '+p.age+' a '+p.sex+' · ['+String(p.sev).toUpperCase()+']'];
  rnSecs(p,mode).forEach(function(s){o.push(s[0]+': '+s[1]);});
  var ts=pTasksAll(p);o.push(ts.length?'Pendientes:':'Pendientes: ninguno');ts.forEach(function(t){o.push('- '+(t.r?'(Ronda) ':'')+t.text);});
  return o.join('\n');
}

  var s=svc(S.rn.sid);if(!s){S.view='services';return viewServices();}
  var R=S.rn,ps=rnPts(),h='<div class="row spread"><button class="btn sm ghost" data-a="rnBack">‹ Servicio</button><h2>Ronda · '+esc(s.name)+'</h2></div>';

  h+=rnPicker();

/* ---------- imágenes JPEG de los estudios (v32; v35: también en la cuenta). Copia local en IndexedDB 'limonapp-img'; con sesión iniciada se suben a /api/img y los otros dispositivos las bajan al verlas. No van al respaldo ni se comparten con colegas ---------- */
var IMX={p:null,url:{},pend:{},v:null},IMG_MAX=12;
var RD_SPECS=['Ortopedia','Neurocirugía','Cirugía general','Cirugía plástica','Cirugía pediátrica','Urología','Trauma / Urgencias','Medicina interna','Otorrinolaringología','Oftalmología','Anestesiología','Radiología (preliminar)','Radiología intervencionista','Oncología','Ginecología'];
function imgDB(){
  if(IMX.p)return IMX.p;
  IMX.p=new Promise(function(res,rej){try{var r=indexedDB.open('limonapp-img',1);r.onupgradeneeded=function(){r.result.createObjectStore('b');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});
  IMX.p.catch(function(){IMX.p=null;});return IMX.p;
}
function imgTx(mode,fn){return imgDB().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('b',mode),rq=fn(tx.objectStore('b'));tx.oncomplete=function(){res(rq&&rq.result);};tx.onerror=tx.onabort=function(){rej(tx.error);};});});}
function imgPut(k,b){return imgTx('readwrite',function(st){return st.put(b,k);});}
function imgGet(k){return imgTx('readonly',function(st){return st.get(k);});}
function imgDel(k){return imgTx('readwrite',function(st){return st.delete(k);});}
/* v35: copia en la cuenta (servidor). IMS.up = IDs ya subidos desde este dispositivo (localStorage rot_imgup). */
var IMS={up:null,fly:{},bf:0,warn:0};
function imgUpSet(){if(IMS.up)return IMS.up;var o={};try{o=JSON.parse(localStorage.getItem('rot_imgup')||'{}')||{};}catch(e){}IMS.up=o;return o;}
function imgUpMark(id,on){var o=imgUpSet();if(on)o[id]=1;else delete o[id];try{localStorage.setItem('rot_imgup',JSON.stringify(o));}catch(e){}}
function imgSrv(){return gOn()&&gAvail();}
function imgApi(method,qs,body){return gTokenP().then(function(t){return fetch('/api/img?'+qs,{method:method,headers:{Authorization:'Bearer '+t},body:body});});}
function imgPush(id){
  if(!imgSrv())return Promise.resolve(false);
  return Promise.all([imgGet('f:'+id),imgGet('t:'+id)]).then(function(a){
    if(!a[0]||!a[1])return false;
    var chk=function(r){if(!r.ok){var e=new Error('http');e.st=r.status;throw e;}return r;};
    return imgApi('PUT','id='+id+'&k=t',a[1]).then(chk).then(function(){return imgApi('PUT','id='+id+'&k=f',a[0]);}).then(chk).then(function(){imgUpMark(id,true);return true;});
  }).catch(function(e){if(e&&e.st===507&&!IMS.warn){IMS.warn=1;toast('Llegaste al tope de imágenes de tu cuenta. Borra algunas para subir más.');}return false;});
}
function imgPull(key){
  if(!imgSrv())return Promise.resolve(null);
  if(IMS.fly[key])return IMS.fly[key];
  var p=key.split(':');
  IMS.fly[key]=imgApi('GET','id='+p[1]+'&k='+p[0]).then(function(r){return r.ok?r.blob():null;}).then(function(b){
    if(!b||!b.size)return null;
    return imgPut(key,b).then(function(){imgUpMark(p[1],true);return b;},function(){return b;});
  }).catch(function(){return null;}).then(function(b){delete IMS.fly[key];return b;});
  return IMS.fly[key];
}
function imgBackfill(){
  if(!imgSrv())return;
  var ids=[];db.entries.forEach(function(e){if(e.type==='img'&&e.data&&e.data.imgs)e.data.imgs.forEach(function(id){if(!imgUpSet()[id])ids.push(id);});});
  var i=0;(function next(){if(i>=ids.length)return;imgPush(ids[i++]).then(next);})();
}
function imgUrl(id,k){
  var key=k+':'+id;if(IMX.url[key])return Promise.resolve(IMX.url[key]);
  return imgGet(key).then(function(b){return b||imgPull(key);}).then(function(b){if(!b)return '';IMX.url[key]=URL.createObjectURL(b);return IMX.url[key];}).catch(function(){return '';});
}
function imgShrink(file,max,q){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight;if(!w||!h){URL.revokeObjectURL(u);rej(new Error('vacia'));return;}
      var sc=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej(new Error('blob'));},'image/jpeg',q);
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('lectura'));};im.src=u;
  });
}
function imgEdInit(ed,d){if(ed.imgInit)return;ed.imgs=(d.imgs||[]).slice();ed.rem=[];ed.imgInit=1;IMX.pend={};}

function imgPlan(){var ed=S.editor,p={put:[],del:(ed.rem||[]).slice()};(ed.imgs||[]).forEach(function(id){if(IMX.pend[id])p.put.push([id,IMX.pend[id]]);});return p;}
function imgCommit(p){
  IMX.pend={};if(!p.put.length&&!p.del.length)return;
  Promise.all(p.put.map(function(a){return imgPut('f:'+a[0],a[1].full).then(function(){return imgPut('t:'+a[0],a[1].thumb);});}))
    .then(function(){return Promise.all(p.del.map(function(id){return imgDel('f:'+id).then(function(){return imgDel('t:'+id);});}));})
    .then(function(){p.del.forEach(function(id){imgUpMark(id,false);if(imgSrv())imgApi('DELETE','id='+id).catch(function(){});});imgHydrate();if(imgSrv())p.put.forEach(function(a){imgPush(a[0]).then(function(ok){if(!ok&&imgSrv())toast('La imagen quedó en este dispositivo, pero no pude subirla a tu cuenta. Se reintenta sola.');});});})
    .catch(function(){toast('No pude guardar la imagen en este dispositivo (sin espacio o sin permiso del navegador).');});
}
function imgDiscard(){
  Object.keys(IMX.pend).forEach(function(id){['f','t'].forEach(function(k){var u=IMX.url[k+':'+id];if(u){try{URL.revokeObjectURL(u);}catch(e){}delete IMX.url[k+':'+id];}});});
  IMX.pend={};
}
function imgDelEntry(e){
  if(!e||e.type!=='img'||!e.data||!e.data.imgs)return;
  e.data.imgs.forEach(function(id){['f','t'].forEach(function(k){var u=IMX.url[k+':'+id];if(u){try{URL.revokeObjectURL(u);}catch(x){}delete IMX.url[k+':'+id];}imgDel(k+':'+id).catch(function(){});});imgUpMark(id,false);if(imgSrv())imgApi('DELETE','id='+id).catch(function(){});});
}
function imgWipe(){imgTx('readwrite',function(st){return st.clear();}).catch(function(){});if(imgSrv())imgApi('DELETE','all=1').catch(function(){});IMS.up={};try{localStorage.removeItem('rot_imgup');}catch(e){}IMX.url={};IMX.pend={};}
function imgAddFiles(files){
  var ed=S.editor;if(!ed||ed.type!=='img'||!ed.imgs)return;
  var room=IMG_MAX-ed.imgs.length;if(room<=0){toast('Máximo '+IMG_MAX+' imágenes por estudio.');return;}
  if(files.length>room){toast('Solo caben '+room+' más; agregué las primeras.');files=files.slice(0,room);}
  var bad=0;
  Promise.all(files.map(function(f){
    return Promise.all([imgShrink(f,2000,.85),imgShrink(f,320,.72)]).then(function(r){
      var id=uid()+uid();IMX.pend[id]={full:r[0],thumb:r[1]};IMX.url['f:'+id]=URL.createObjectURL(r[0]);IMX.url['t:'+id]=URL.createObjectURL(r[1]);ed.imgs.push(id);
    }).catch(function(){bad++;});
  })).then(function(){
    var b=document.getElementById('imgBox');if(b){b.innerHTML=edImgsHtml();imgHydrate();}
    if(bad)toast('No pude leer '+bad+' archivo(s). Usa JPEG o PNG (si es HEIC, elige "más compatible" al exportar).');
  });

 lookReset:function(){try{localStorage.removeItem('rot_look');}catch(e){}applyLook();render();toast('Apariencia restablecida.');},
 makeBackup:function(){S.backupText=JSON.stringify(db);db.meta.lastBackup=new Date().toISOString();db.meta.changes=0;persist();render();},
 copyBackup:function(){copyText(S.backupText,'backupOut');},
 restore:function(){
   if(S.confirm!=='restore'){S.confirm='restore';render();return;}
   try{var d=JSON.parse(val('backupIn'));if(!d||d.v!==1||!Array.isArray(d.services)||!Array.isArray(d.patients)||!Array.isArray(d.entries)||!Array.isArray(d.tasks))throw 0;d.meta=d.meta||{};d.meta.mod=new Date().toISOString();db=d;persist();S.confirm=null;S.backupText='';render();toast('Respaldo restaurado.');}
   catch(e){S.confirm=null;render();toast('El respaldo no es válido.');}
 },
 editHx:function(){S.hxOpen=true;S.hxEdit=true;S.hxDraft=null;S.warned=false;render();},
 cancelHx:function(){S.hxEdit=false;S.hxDraft=null;S.warned=false;render();},
 parseHx:function(){
   var cur={};HXF.forEach(function(f){cur[f[0]]=val('hx_'+f[0]).trim();});
   var pr=parseHx(val('hx_paste'));
   if(!Object.keys(pr).length){toast('Pega primero el texto.');return;}
   for(var k in pr)cur[k]=cur[k]?cur[k]+'\n'+pr[k]:pr[k];
   tidyObj(cur);S.hxDraft=cur;render();toast('Organizado. Revisa cada sección y guarda.');
 },
 tidyHx:function(){var d={};HXF.forEach(function(f){d[f[0]]=dropNoise(val('hx_'+f[0]).trim()).t;});tidyObj(d);S.hxDraft=d;render();toast('Formato ordenado. Revisa y guarda.');},
 saveHx:function(){
   var o={},all='';HXF.forEach(function(f){var v=val('hx_'+f[0]).trim();if(v){o[f[0]]=v;all+=' '+v;}});
   if(LONGNUM.test(all)&&!S.warned){S.hxDraft=o;S.warned=true;render();return;}
   pat(S.patientId).hx=o;save();S.hxEdit=false;S.hxDraft=null;S.warned=false;render();toast('Historia guardada.');
 },
 copyHx:function(){copyText(hxText(pat(S.patientId)),'hxview');},
 pickPdf:function(el){var i=document.createElement('input');i.type='file';i.accept='application/pdf,.pdf';i.onchange=function(){if(i.files&&i.files[0])importPdf(i.files[0],el.dataset.mode);};i.click();},
 toggleUpd:function(el){var i=S.upd&&S.upd.items[+el.dataset.i];if(i&&!i.dup){i.on=!i.on;render();}},
 applyUpd:function(){doApplyUpd();},
 cleanNoise:function(el){var p=pat(S.patientId),t=el.dataset.t,n=0;if(!p)return;
  db.entries.filter(function(e){return e.patientId===p.id&&e.type===t;}).forEach(function(e){for(var k in e.data){if(typeof e.data[k]==='string'){var r=dropNoise(e.data[k]);if(r.n){e.data[k]=tidy(r.t);n+=r.n;}}}});
  if(n)save();render();toast(n?'Quité '+n+' fragmento'+(n===1?'':'s')+' de consentimiento o datos administrativos.':'No encontré consentimientos ni datos administrativos.');},
 cancelUpd:function(){S.upd=null;render();},
 fold:function(el){S.fold[el.dataset.k]=S.fold[el.dataset.k]?0:1;try{localStorage.setItem('rot_fold',JSON.stringify(S.fold));}catch(e){}render();},
 goSec:function(el){var k=el.dataset.k;S.smax=30;if(k==='hx'){S.sec='res';S.hxOpen=true;render();var h=document.getElementById('hxcard');if(h)h.scrollIntoView({block:'start'});return;}S.sec=k;render();window.scrollTo(0,0);},
 toggleTheme:function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');},
 toggleBi:function(){S.bi=!S.bi;try{localStorage.setItem('rot_bi',S.bi?'1':'0');}catch(e){}render();},
 delDemo:function(){db.patients.filter(function(p){return p.demo;}).forEach(function(p){delPatientData(p.id);});save();render();toast('Ejemplo borrado.');},
 askWipe:function(){S.confirm='wipe';render();},
 wipe:function(){try{imgWipe();}catch(x){}db={v:1,meta:{changes:0,lastBackup:null,mod:new Date().toISOString()},services:[],patients:[],entries:[],tasks:[]};persist();S.confirm=null;go('services');toast('Todo borrado.');}
};

for(var k_ in AT)A[k_]=AT[k_];
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;var f=A[el.dataset.a];if(f){if(el.type==='checkbox'){f(el);}else f(el);}});
document.addEventListener('change',function(e){var el=e.target;if(el.id==='handSel'){A.handSel(el);}
  if(el.id==='backupFile'&&el.files&&el.files[0]){var r=new FileReader();r.onload=function(){document.getElementById('backupIn').value=String(r.result||'');toast('Archivo cargado. Toca Restaurar.');};r.readAsText(el.files[0]);}});
function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0;}
function clearOver(){Array.prototype.forEach.call(document.querySelectorAll('.drop.over'),function(d){d.classList.remove('over');});}
document.addEventListener('dragover',function(e){if(!hasFiles(e))return;e.preventDefault();clearOver();var z=e.target.closest&&e.target.closest('.drop');if(z)z.classList.add('over');});
document.addEventListener('dragleave',function(e){if(!e.relatedTarget)clearOver();});
document.addEventListener('drop',function(e){
  if(!hasFiles(e))return;e.preventDefault();clearOver();
  var z=e.target.closest&&e.target.closest('.drop'),f=e.dataTransfer.files[0];if(!f)return;
  var mode=z?z.dataset.mode:(S.view==='service'&&S.newPatient?'new':(S.view==='patient'?'upd':null));
  if(!mode){toast('Abre “+ Paciente” o la ficha de un paciente y suelta ahí el PDF.');return;}
  importPdf(f,mode);
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter]();}});

gBoot();
