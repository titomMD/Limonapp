<!--
NOTAS PARA RETOMAR ESTA APP EN UN CHAT NUEVO (v12, 21-oct-2026)
App: "Limonapp" (antes Mis rotaciones) - notas por paciente/servicio, pendientes, entrega de turno, respaldo, historia clinica, UI español + aleman simultaneo (boton DE).
Archivo unico: HTML + CSS + JS vanilla, sin dependencias. Datos en localStorage, clave 'rotaciones_v1' (por navegador/origen; el respaldo exporta/importa JSON).
Estructura JS: render() -> viewServices / viewService / viewPatient / viewTasks / viewHandoff / viewBackup; acciones en el objeto con data-a="..." (nav, openService, openPatient, saveEntry, ...).
Aleman: diccionario DE{} + applyDE() recorre los nodos de texto bajo .wrap (no toca dd, pre, textarea, .dx, .t). Textos nuevos en español -> añadir su par en DE{}.
Diseño: tokens CSS en :root (claro/oscuro). Movil = una columna. Escritorio (>=900px) = barra lateral + rejillas .cols + ficha de paciente en dos columnas (.pv/.pv-l/.pv-r).
Despliegue: (1) este artifact (claude.ai/artifact/6y6mRYaD4irFajhpPvnkQj): leerlo con Artifact read, editar y republicar con la misma URL. (2) PWA en Netlify: la version PWA es este mismo HTML + <head> con manifest + registro de sw.js; hay que volver a subir la carpeta/zip a Netlify tras cada cambio (sw.js actualiza en la 2a carga).
Importar PDF (v5): zona .drop en 'Nuevo paciente' y en Historia clinica; pdf.js 3.11.174 desde cdnjs (carga perezosa, solo texto, sin OCR); importPdf -> analyzePdf (pdfFields, splitPdf, parseEv, redact) -> applyPdfNew / applyPdfHx; la ultima evolucion (por fecha) se precarga en el editor via S.pdfEv / accion useEv. Quita lineas de nombre/cedula/telefono y numeros de 7+ digitos.
Datos (v6): navigator.storage.persist() al cargar + aviso (needBackup) si hay 15+ cambios sin respaldar o 7+ dias desde el ultimo respaldo. Nunca cambiar KEY ni la URL del artifact.
Paraclinicos e imagenes (v7): TYPES.lab y TYPES.img (flag sep:1) se guardan como entries, se muestran en sepCard() aparte y se excluyen de Agregar y de la cronologia.
Actualizar desde PDF (v8): updCard() en la ficha; analyzeAll -> splitAll (encabezados EVH/LABH/IMGH/ICH, tabla HXR) -> buildUpd (dedupe, IC pendiente se responde, HC se agrega al final) -> doApplyUpd. Selector #updKind fuerza el tipo si el PDF no tiene encabezados. Afinar regex de encabezados con PDF real del hospital.
Tema Limón (v9): oscuro por defecto + boton claro/oscuro (localStorage rot_theme, atributo data-theme en <html>); imagenes del gato Limón embebidas en base64 en var IMG (logo, sit, sleep, peek, shelf, lemon, pat, paw, fish, yarn; webp con alfa, fondo magenta quitado con chroma-key). Fondo = html::before (patron, var --pat) + html::after (brillos teal/naranja). Paleta oscura: verde-negro #0e1514, teal #4cc2a8, naranja Limón #F29A3C. Archivos originales en el chat del usuario.
Secciones del paciente (v10): SECS/secHtml/foldWrap/subTabs en viewPatient; chips 'Todo|Historia|Cronología|Interconsultas|Paraclínicos|Imágenes|Pendientes|Importar PDF' (S.sec), ocultar con ▴ (S.fold en localStorage rot_fold; 'Importar PDF' oculto por defecto) y ↗ abre la sección aparte. Interconsulta tiene own:1 (tarjeta propia, fuera de cronología). Limpieza de texto importado: tidy()/stripRepeats()/rich() (une líneas cortadas, quita encabezados repetidos, pasa MAYÚSCULAS a oración, viñetas y etiquetas en negrita); botón 'Ordenar formato' en edición de HC.
Importacion limpia (v11): dropNoise() quita consentimientos informados (CONSH/CONS) y lineas administrativas (ADMIN) antes de separar el PDF; casilla input.noiseOn en dropZone; boton 'Limpiar' (A.cleanNoise) en Paraclinicos/Imagenes para entradas ya guardadas; tidyHx tambien lo aplica. rich() da estructura visual: encabezados .sh, etiquetas en negrita (lbl), fechas (.dt), valores clinicos (.val), parrafos largos partidos por oraciones (.pg).
Lectura HUS (v12): pdfPages()->isHus()/husPage() lee cada pagina por su cabecera ('Pagina n/N', 'TITULO nFOLIO:', fecha de registro, paciente) y agrupa paginas del mismo folio; husKind() clasifica (ev/ic/in/ep/nt) y omite enfermeria, escalas, consentimientos, solicitudes; parseEvHUS (S/O/A/P por encabezados), parseIcHUS (servicio desde 'RESPUESTA A INTERCONSULTA POR X'), analyzeHus(). Formatos de otros hospitales siguen por analyzeAll. Tope EVMAX evoluciones al crear paciente.
Privacidad: la app pide solo iniciales, edad, cama y 3 ultimos digitos de HC; avisa si detecta numeros largos.
v31 (25-oct-2026) LOGIN CON SUPABASE: ya no se usa Netlify Identity. Proyecto Supabase 'Limonapp' (URL y clave publishable en SB_URL/SB_KEY, publicas por diseño; NUNCA guardar secret/service_role). Solo Google; correo y anonimo desactivados en Supabase. Cliente: SOLO @supabase/auth-js 2.117.2 empaquetado con esbuild en public/vendor/auth-js.supabase.js (expone window.LimonAuth.GoTrueClient; entrada: import {GoTrueClient} from '@supabase/auth-js'; window.LimonAuth={GoTrueClient}; npx esbuild --bundle --minify --format=iife). En el artifact (claude.ai) gAvail() es falso: no hay login ni carga la libreria. Flujo PKCE con redireccion completa; gOnSess() maneja INITIAL_SESSION/SIGNED_IN/SIGNED_OUT; sbUser() da u.id/u.email/u.jwt(forzar) como antes; gWho() pide /api/sync?whoami=1 para saber con que ID guarda el servidor los datos de la persona (G.uid) y asi gSt().uid de las cuentas anteriores no se reinicia. Servidor: netlify/functions/sync.mjs y social.mjs llevan el MISMO bloque AUTH (entre AUTH-BEGIN y AUTH-END): verifica el token ES256 con el JWKS del proyecto (WebCrypto, sin librerias), emisor, audiencia, vencimiento. Tabla LEGACY en ese bloque: huella SHA-256 del correo de Google verificado -> ID viejo de Netlify Identity (3 cuentas; el repositorio es publico, por eso no van los correos); quien no esta en la tabla usa su ID de Supabase (registro abierto). Para dar a alguien un ID existente hay que editar LEGACY en los dos archivos y desplegar. Llaves de datos no cambian: u_<id> (almacen limonapp), p_/t_/m_/e_/f_/sp_ (limonapp-social). Netlify Identity puede apagarse cuando todo funcione.
v44 (27-oct-2026) IA COMPARTIDA: netlify/functions/ai.mjs (/api/ai) llama a Gemini con la clave GEMINI_API_KEY que vive solo en Netlify. Solo usuarios aprobados (lista en Blobs 'limonapp-ai', la administra AI_ADMIN_EMAIL desde Cuenta), 15 usos/dia y 200/mes por persona, espera de 15 s, tope mensual estimado AI_BUDGET_USD (por defecto 6) e interruptor AI_OFF. El servidor guarda los prompts (el cliente envia id de preset + texto); no guarda ni registra textos. Cliente: proveedor 'limon' en AIP (por defecto si hay sesion), consentimiento en rot_ai.consent, aiApi/aiWho/aiAdminCard.
v43 (27-oct-2026) ASISTENTE DE IA: localStorage rot_ai={prov,model,key,extra} (por dispositivo; NO va en rotaciones_v1, respaldo ni sincronizacion). aiFetch llama directo desde el navegador a Anthropic (/v1/messages con anthropic-dangerous-direct-browser-access), OpenAI (chat/completions) o Gemini (generateContent); sin servidor intermedio. aiOpen abre un modal (#aiModal, fuera de render para no perder el formulario) con el texto elegido (seleccion o campo enfocado, via AIL), preset (AIPRE + AIBASE) y respuesta con copiar/reemplazar/agregar. aiRedact tapa numeros largos antes de enviar. aiCard() en Cuenta.
v42 (27-oct-2026) LOGO NUEVO: gato de linea con latido ECG y hoja de limon (amarillo #F2C417/#D9A400 y verde #2F8F6A/#1F7A5A). Todas las ilustraciones (logo, logoL claro, sit, peek, sleep, shelf, paw, fish, yarn) son SVG en IMG (data:image/svg+xml), con tonos intermedios que se leen en oscuro y claro; setTheme cambia #logo entre IMG.logo e IMG.logoL. icon-192.png e icon-512.png se generaron del mismo SVG sobre #0e1514. pat y lemon (fondo y toast) siguen siendo las imagenes anteriores.
v41 (27-oct-2026) APARIENCIA: localStorage rot_look={acc,font,fs,rad,bw,bg} (por dispositivo, no toca rotaciones_v1). applyLook() (se llama desde setTheme) pone variables en <html>: --accent/--accent-ink/--accent-soft/--c-ingreso (ACCS: par oscuro/claro por preset o color libre), --font (FONTS), --zm (zoom de .wrap, 85-140%), --rs (multiplicador de border-radius) y --bw (grosor de borde); data-bg=0 apaga el fondo decorado. Los radios del CSS principal son calc(Npx*var(--rs,1)); las reglas .px quedan igual (estilo 8-bit con sus bordes). Tarjeta lookCard() en la vista Cuenta.
v40 (27-oct-2026) PROCEDIMIENTOS: campo data.proc (texto, una linea por procedimiento) en ingreso, evolucion, consulta y plan; ensurePlan lo copia al plan derivado; planCard/evBody/censo lo muestran. cupsBox/cupsLoad/cupsFind: buscador sobre vendor/cups.txt (codigo|capitulo|nombre|grupo; 9459 codigos CUPS 2026, Res. 2706 de 2025 Anexo 2; carga perezosa; filtro por capitulo). La casilla manual siempre esta abierta.
v39 (27-oct-2026) CENSO EN WORD: docxBuild/zipStore (ZIP sin compresion + CRC32, sin librerias) arma un .docx en el navegador; dlToWord convierte el HTML dt/dd de evBody/imgBody/notaBody/T.f en parrafos; acciones censoSvc (lista activa/egresada del servicio: tabla de camas + un paciente por pagina) y censoPt. Orden cronologico ascendente, sin planes derivados (data.src), con pendientes abiertos al final. No incluye las fotos (IndexedDB).
v38 (27-oct-2026) CONSULTA EXTERNA Y URGENCIAS: p.ctx ('hosp' por defecto|'urg'|'amb'), p.urgAt, p.hospAt; entry.ctx se estampa al crear (consulta=amb, triage/traslado=urg, el resto el p.ctx del paciente; sin ctx = hospitalizacion). Tipos nuevos: consulta (vez, medico, historia, dx CIE-10, plan y ordenes -> ensurePlan), triage (nivel I-V, llegada, vitales) y traslado (hide, paso a hospitalizacion). Vista S.view='urg' (viewUrg): lista por nivel de triage y tiempo en observacion, casillas S.urgSel y A.urgHosp (paso masivo con servicio de destino); servicio 'Urgencias' se crea solo (ensureUrgSvc). Secciones triage/consulta aparecen en el paciente solo si corresponden. Cronologia con filtro por atencion (S.cc).
v37 (27-oct-2026) ORDEN Y NOMBRES: pestaña Respaldo -> Cuenta (la vista sigue siendo 'backup'); la seccion Historia se fusiona en Resumen (tarjeta desplegable 'Historia del ultimo ingreso', S.hxOpen; goSec k=hx redirige a res); nuevas secciones propias Ingreso, Evoluciones, Notas aclaratorias y Salida (typedSec, tope S.smax) y Cronologia queda solo como filtro/buscador de todo lo del paciente salvo plan (S.cord invierte el orden). La nota pasa a 'nota aclaratoria': data={ref,refT,refAt,tipo,campo,orig,txt}; las notas antiguas (solo txt) se siguen viendo y editando. Acciones nuevas: goFolio, aclarar, secMore, cronOrd. Se quitan addFold/addRow.
v35 (25-oct-2026) IMAGENES EN LA CUENTA: netlify/functions/img.mjs (/api/img, misma verificacion AUTH, store de Blobs 'limonapp-img', claves i_<uid>_<id>_f|t, solo JPEG, 4 MB, tope 2000 archivos por usuario; GET/PUT/DELETE ?id=&k= y DELETE ?all=1). Cliente: imgPush/imgPull/imgBackfill; copia local sigue en IndexedDB; rot_imgup = IDs ya subidos; al ver una imagen que no esta local se baja. No se comparten con colegas ni van al respaldo.
v32 (25-oct-2026) IMAGENES Y LECTURAS: entradas tipo img guardan data.imgs (IDs de JPEG), data.lecNo (1 = lectura oficial 'No leida aun', y se omite data.lec), data.lec (informe oficial, igual que antes), data.rd (lecturas por especialidad: [{s,t,at}]) y data.mia (mis hallazgos, igual que antes). Entradas antiguas con lec/mia se ven igual. Los JPEG NO van en rotaciones_v1 ni se sincronizan ni entran al respaldo: viven en IndexedDB 'limonapp-img' (almacen 'b', claves 'f:ID' imagen reducida a 2000 px y 't:ID' miniatura 320 px, ambas JPEG sin EXIF). En otro dispositivo se ve 'Solo en otro dispositivo'. Se borran al borrar la entrada, el paciente o todos los datos. Sin cambios en el servidor.

function setTheme(t){
  try{document.documentElement.setAttribute('data-theme',t);}catch(e){}
  try{localStorage.setItem('rot_theme',t);}catch(e){}
  var b=document.getElementById('themeBtn');if(b){b.innerHTML='<span class="ti">'+(t==='dark'?'☾':'☀')+'</span><span class="tt">'+(t==='dark'?'Tema oscuro':'Tema claro')+'</span>';b.title=t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro';}
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0e1514':'#f1f4f3');
  var lg=document.getElementById('logo');if(lg&&typeof IMG!=='undefined')lg.src=t==='dark'?IMG.logo:IMG.logoL;
  if(typeof applyLook==='function')applyLook();
}

var ACCS=[['teal','Verde azulado','',''],['limon','Naranja Limón','#F29A3C','#b4620a'],['lima','Lima','#a8d44a','#5b7d0c'],['azul','Azul','#6aa8f5','#1f5aa8'],['violeta','Violeta','#b497e6','#6a47a3'],['rosa','Rosa','#f08ab5','#a8306a'],['gris','Grafito','#aab7b3','#34413e']];
var FONTS=[['plex','IBM Plex Sans (actual)',''],['sys','Sistema','-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'],['serif','Con serifa','Georgia,"Iowan Old Style","Times New Roman",serif'],['round','Redondeada','ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif'],['mono','Monoespaciada','"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace']];
var RADS=[['0','Rectas',0],['1','Suaves (actual)',1],['2','Redondeadas',1.9]];
var BWS=[['1','Fino (actual)','1px'],['2','Medio','2px'],['3','Grueso','3px']];
function lookGet(){var o={};try{o=JSON.parse(localStorage.getItem('rot_look')||'{}')||{};}catch(e){}return o;}
function lookSet(o){try{localStorage.setItem('rot_look',JSON.stringify(o));}catch(e){}}
function hexLum(h){var m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return 0;var n=parseInt(m[1],16),f=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(n>>16)+0.7152*f((n>>8)&255)+0.0722*f(n&255);}
function applyLook(){
  var L=lookGet(),st=document.documentElement.style,dark=document.documentElement.getAttribute('data-theme')==='dark';
  var col='';
  if(L.acc){var pr=ACCS.filter(function(a){return a[0]===L.acc;})[0];col=pr?(dark?pr[2]:pr[3]):(/^#[0-9a-f]{6}$/i.test(L.acc)?L.acc:'');}
  if(col){st.setProperty('--accent',col);st.setProperty('--accent-ink',hexLum(col)>0.4?'#0e1514':'#ffffff');st.setProperty('--accent-soft','color-mix(in srgb,'+col+' 20%,var(--surface))');st.setProperty('--c-ingreso',col);}
  else{['--accent','--accent-ink','--accent-soft','--c-ingreso'].forEach(function(k){st.removeProperty(k);});}
  var fo=FONTS.filter(function(f){return f[0]===L.font;})[0];
  if(fo&&fo[2])st.setProperty('--font',fo[2]);else st.removeProperty('--font');
  var fs=+L.fs||100;if(fs!==100)st.setProperty('--zm',String(fs/100));else st.removeProperty('--zm');
  var ra=RADS.filter(function(r){return r[0]===L.rad;})[0];if(ra&&ra[0]!=='1')st.setProperty('--rs',String(ra[2]));else st.removeProperty('--rs');
  var bw=BWS.filter(function(b){return b[0]===L.bw;})[0];if(bw&&bw[0]!=='1')st.setProperty('--bw',bw[2]);else st.removeProperty('--bw');
  if(L.bg===0)document.documentElement.setAttribute('data-bg','0');else document.documentElement.removeAttribute('data-bg');
}
function lookCard(){

/* ---------- CIE-10 (listado en español, archivo aparte que se carga la primera vez que se usa) ---------- */
var CIE={st:0,c:[],n:[],t:[],q:[]};
function cieLoad(cb){
  if(CIE.st===2){cb(true);return;}
  if(CIE.st===1){CIE.q.push(cb);return;}
  CIE.st=1;CIE.q=[cb];
  function done(ok){CIE.st=ok?2:-1;var q=CIE.q;CIE.q=[];q.forEach(function(f){try{f(ok);}catch(e){}});}
  try{
    fetch('vendor/cie10.txt').then(function(r){if(!r.ok)throw new Error('x');return r.text();}).then(function(tx){
      tx.split('\n').forEach(function(l){var i=l.indexOf('|');if(i<1)return;CIE.c.push(l.slice(0,i));var nm=l.slice(i+1);CIE.n.push(nm);CIE.t.push(norm(nm));});
      done(CIE.c.length>1000);
    }).catch(function(){done(false);});
  }catch(e){done(false);}
}
function cieFind(q){
  var raw=String(q||'').trim(),out=[],i,n=CIE.c.length;
  if(!raw)return out;
  var code=raw.replace(/[\s.]/g,'').toUpperCase();
  if(/^[A-Z]\d{1,3}X?$/.test(code)){
    var cc=code.replace(/X$/,'');
    for(i=0;i<n&&out.length<14;i++)if(CIE.c[i].indexOf(code)===0||(cc.length===3&&CIE.c[i]===cc+'X'))out.push(i);
    if(!out.length)for(i=0;i<n&&out.length<14;i++)if(CIE.c[i].indexOf(cc)===0)out.push(i);
    return out;
  }
  var tk=norm(raw).split(' ').filter(Boolean);if(!tk.length)return out;
  var hit=[];
  for(i=0;i<n;i++){
    var t=CIE.t[i],ok=true,j;
    for(j=0;j<tk.length;j++)if(t.indexOf(tk[j])<0){ok=false;break;}
    if(ok)hit.push([(t.indexOf(tk[0])===0?0:(t.indexOf(' '+tk[0])>=0?1:2))*1000+t.length,i]);
  }
  hit.sort(function(a,b){return a[0]-b[0];});
  return hit.slice(0,14).map(function(x){return x[1];});
}
function cieBox(target,hint){
  return '<div class="cie" data-t="'+target+'"><input class="cieq" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(hint||'Buscar diagnóstico CIE-10 (código o nombre)')+'" aria-label="Buscar diagnóstico CIE-10"><div class="cier" hidden></div></div>';
}
var cieTimer=null;
function cieRun(inp){
  var box=inp.closest('.cie'),res=box.querySelector('.cier'),q=inp.value;
  if(!q.trim()){res.hidden=true;res.innerHTML='';return;}
  res.hidden=false;res.innerHTML='<div class="small muted" style="padding:9px 12px">Buscando…</div>';
  cieLoad(function(ok){
    if(!ok){res.innerHTML='<div class="small muted" style="padding:9px 12px">No pude cargar el listado CIE-10 (hace falta conexión la primera vez). Escribe el diagnóstico a mano.</div>';return;}
    if(inp.value!==q)return;
    var ix=cieFind(q);
    res.innerHTML=ix.length?ix.map(function(i){return '<button type="button" class="cieo" data-a="ciePick" data-i="'+i+'"><b>'+esc(CIE.c[i])+'</b> '+esc(accFix(CIE.n[i]))+'</button>';}).join(''):'<div class="small muted" style="padding:9px 12px">Sin coincidencias. Prueba con otra palabra o con el código.</div>';
  });
}
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.classList||!t.classList.contains('cieq'))return;
  clearTimeout(cieTimer);cieTimer=setTimeout(function(){cieRun(t);},180);
});
function ciePickInto(i,box){
  var tid=box.dataset.t,t=document.getElementById(tid);if(!t)return;

  var q=box.querySelector('.cieq'),r=box.querySelector('.cier');q.value='';r.hidden=true;r.innerHTML='';
  try{t.dispatchEvent(new Event('input',{bubbles:true}));}catch(e){}
}

/* ---------- v40: procedimientos (catálogo CUPS opcional + casilla manual siempre abierta) ---------- */
var CUPS={st:0,q:[],c:[],k:[],n:[],g:[],t:[],cats:[]};
function cupsLoad(cb){
  if(CUPS.st===2){cb(true);return;}
  if(CUPS.st===1){CUPS.q.push(cb);return;}
  CUPS.st=1;CUPS.q=[cb];
  function done(ok){CUPS.st=ok?2:-1;var q=CUPS.q;CUPS.q=[];q.forEach(function(f){try{f(ok);}catch(e){}});}
  try{
    fetch('vendor/cups.txt').then(function(r){if(!r.ok)throw new Error('x');return r.text();}).then(function(tx){
      var seen={};
      tx.split('\n').forEach(function(l){var a=l.split('|');if(a.length<3||!a[0].trim())return;CUPS.c.push(a[0].trim());CUPS.k.push(a[1].trim());var nm=a[2].trim(),gr=(a[3]||'').trim();CUPS.n.push(nm);CUPS.g.push(gr);CUPS.t.push(norm(nm+' '+gr+' '+a[0]));if(!seen[a[1].trim()]){seen[a[1].trim()]=1;CUPS.cats.push(a[1].trim());}});
      done(CUPS.c.length>0);
    }).catch(function(){done(false);});
  }catch(e){done(false);}
}
function cupsBox(target){
  return '<div class="cie cups" data-t="'+target+'"><input class="cupsq" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buscar en el catálogo de procedimientos (código o nombre)" aria-label="Buscar procedimiento en el catálogo"><div class="cier" hidden></div><div class="small muted" style="margin-top:4px">Si no lo encuentras, escríbelo directamente en la casilla de arriba: se guarda tal cual.</div></div>';

function cupsFind(q,cat){

  });
}

var VIT=[['tas','TA sistólica','mmHg'],['tad','TA diastólica','mmHg'],['tam','TA media','mmHg'],['fc','FC','lpm'],['fr','FR','rpm'],['t','Temperatura','°C'],['sat','SatO₂','%'],['peso','Peso','kg'],['gluc','Glucometría','mg/dL']];
var GLO=[['go','Ojos',['4 · Espontánea','3 · A la voz','2 · Al dolor','1 · Ninguna']],['gv','Verbal',['5 · Orientado','4 · Confuso','3 · Palabras inapropiadas','2 · Sonidos incomprensibles','1 · Ninguna']],['gm','Motora',['6 · Obedece órdenes','5 · Localiza el dolor','4 · Retira','3 · Flexión anormal','2 · Extensión','1 · Ninguna']]];
var EXL=[['gen','Estado general'],['cab','Cabeza y cuello'],['tor','Tórax / cardiopulmonar'],['abd','Abdomen'],['gu','Genitourinario'],['ext','Extremidades'],['neu','Neurológico'],['piel','Piel']];
function pamOf(v){
  if(v.tam)return v.tam;
  var s=parseFloat(String(v.tas||'').replace(',','.')),d=parseFloat(String(v.tad||'').replace(',','.'));
  return (s>0&&d>0)?String(Math.round((s+2*d)/3)):'';
}
function glasgowTot(v){var a=+v.go||0,b=+v.gv||0,c=+v.gm||0;return (a&&b&&c)?a+b+c:0;}
function vitParts(v){
  v=v||{};var o=[],pam=pamOf(v);
  if(v.tas||v.tad)o.push(['TA',(v.tas||'?')+'/'+(v.tad||'?')+(pam?' (PAM '+pam+')':'')]);
  else if(pam)o.push(['PAM',pam]);
  if(v.fc)o.push(['FC',v.fc+' lpm']);if(v.fr)o.push(['FR',v.fr+' rpm']);if(v.t)o.push(['T',v.t+' °C']);if(v.sat)o.push(['SatO₂',v.sat+' %']);
  if(v.peso)o.push(['Peso',v.peso+' kg']);if(v.gluc)o.push(['Glucometría',v.gluc+' mg/dL']);

  if(gt)o.push(['Glasgow',gt+'/15 (O'+v.go+' V'+v.gv+' M'+v.gm+')']);else if(v.go||v.gv||v.gm)o.push(['Glasgow',[v.go?'O'+v.go:'',v.gv?'V'+v.gv:'',v.gm?'M'+v.gm:''].filter(Boolean).join(' ')]);

function ordLines(txt){return String(txt||'').split('\n').map(function(x){return x.replace(/^[-•*\s]+/,'').trim();}).filter(Boolean);}
function planOf(e){return db.entries.filter(function(x){return x.type==='plan'&&x.data&&x.data.src===e.id;})[0];}
function mkOrd(old,lab,img){
  var out=[],used={};
  function add(k,n){
    var key=k+'|'+norm(n),f=(old||[]).filter(function(o){return !used[o.id]&&o.k===k&&norm(o.n)===norm(n);})[0];
    if(f){used[f.id]=1;out.push(f);}else out.push({id:uid(),k:k,n:n});
  }
  ordLines(lab).forEach(function(n){add('lab',n);});ordLines(img).forEach(function(n){add('img',n);});
  (old||[]).forEach(function(o){if(!used[o.id]&&o.k&&o.keep)out.push(o);});
  return out;
}
/* Cada evolución o ingreso con plan u órdenes mantiene una entrada "Plan" ligada (data.src). */
function ensurePlan(e){
  if(!e||(e.type!=='evolucion'&&e.type!=='ingreso'&&e.type!=='consulta'))return;
  var d=e.data||{},ptxt=String((e.type==='evolucion'?d.p:d.plan)||'').trim(),pl=planOf(e);
  var ord=mkOrd(pl&&pl.data.ord,d.ordl,d.ordi),pro=String(d.proc||'').trim();
  if(!ptxt&&!ord.length&&!pro){if(pl)db.entries=db.entries.filter(function(x){return x!==pl;});return;}
  if(pl){pl.at=e.at;pl.data.plan=ptxt;pl.data.ord=ord;pl.data.src=e.id;if(pro)pl.data.proc=pro;else delete pl.data.proc;}
  else db.entries.push({id:uid(),patientId:e.patientId,type:'plan',at:e.at,data:Object.assign({plan:ptxt,ord:ord,src:e.id},pro?{proc:pro}:{})});
}
function ensurePlans(pid){db.entries.filter(function(x){return x.patientId===pid&&(x.type==='evolucion'||x.type==='ingreso'||x.type==='consulta');}).forEach(ensurePlan);}

var FILLK={ingreso:['in'],evolucion:['ev'],plan:['pl'],interconsulta:['ic'],lab:['lab'],img:['img'],nota:['nt'],salida:['ev']};
function formNow(){
  var ed=S.editor,T=TYPES[ed.type],d={};
  if(ed.type==='evolucion')return evCollect();
  T.f.forEach(function(f){var v=val('e_'+f[0]).trim();if(v)d[f[0]]=v;});
  return d;
}
function itemText(it){
  var d=it.data||{},rows=[];
  if(it.k==='ev'){var ee=evNorm(d);return [ee.tit,ee.dx,ee.s,composeO(ee),ee.a,ee.p].filter(Boolean).join('\n');}
  Object.keys(d).forEach(function(k){if(k!=='ord'&&d[k])rows.push(dataText(d[k]));});
  return rows.join('\n');
}
function fillMap(ed,it){
  var d=it.data||{},ty=ed.type,o={};
  if(ty==='evolucion'){o=evNorm(d);}
  else if(ty==='ingreso'){['motivo','ea','ant','ef','imp','plan'].forEach(function(k){if(d[k])o[k]=d[k];});}
  else if(ty==='plan'){o.plan=d.plan||'';(d.ord||[]).forEach(function(x){var k=x.k==='img'?'ordi':'ordl';o[k]=(o[k]?o[k]+'\n':'')+x.n;});if(d.proc)o.proc=d.proc;}
  else if(ty==='interconsulta'){if(d.serv)o.serv=d.serv;if(d.resp)o.resp=d.resp;if(d.preg)o.preg=d.preg;}
  else if(ty==='lab'){o={est:d.est||'',res:d.res||''};}
  else if(ty==='img'){o={est:d.est||''};if(d.lec)o.lec=d.lec;if(d.mia)o.mia=d.mia;}
  else if(ty==='nota'){o.txt=(it.k==='nt'&&d.txt)?d.txt:(KNAME[it.k]+'\n'+itemText(it));}
  else if(ty==='salida'){
    o.tipo='Alta';var ee=evNorm(d);
    if(it.ext&&it.ext.dest)o.dest=it.ext.dest;
    var pend=String(ee.p||'').split('\n').filter(function(l){return /control|cita|consulta/i.test(l);}).map(function(l){return l.replace(/^[-•*\s]+/,'');});
    if(pend.length)o.pend=pend.join('\n');
  }
  return o;
}
function fillFromPdf(file){
  var ed=S.editor;if(!ed)return;
  if(!/\.pdf$/i.test(file.name)&&!/pdf/i.test(file.type)){toast('Solo archivos PDF.');return;}
  if(file.size>25e6){toast('El PDF pesa más de 25 MB.');return;}
  toast('Leyendo el PDF…');
  pdfPages(file).then(function(pages){
    if(pages.join('').replace(/\s/g,'').length<40){toast('Este PDF no tiene texto (parece una foto o escaneo). Por ahora no leo imágenes.');return;}
    var r=(ed.type==='lab'&&labRep(pages))||(isHus(pages)?analyzeHus(pages):analyzeAll(stripRepeats(pages),'auto'));
    var kinds=FILLK[ed.type]||[],items=r.items.filter(function(i){return kinds.indexOf(i.k)>=0;});
    if(ed.type==='salida')items=items.filter(function(i){return i.data&&(i.data.tit||i.ext&&i.ext.dest);}).concat(items);
    if(!items.length&&ed.type==='nota')items=r.items.slice();
    if(!items.length){
      var have={};r.items.forEach(function(i){have[KNAME[i.k]||i.k]=1;});
      if(!r.items.length&&Object.keys(r.hx||{}).length)have['Historia clínica']=1;
      var tx=Object.keys(have);
      toast(tx.length?'Este PDF trae: '+tx.join(', ').toLowerCase()+'. Ábrelo en esa opción, o usa Importar PDF.':'No reconocí nada para esta nota en el PDF.');
      return;
    }
    items.sort(function(a,b){return a.at<b.at?1:-1;});
    var it=(ed.type==='ingreso')?items[items.length-1]:items[0];
    var cur=formNow(),pdfd=fillMap(ed,it),m={},k;
    for(k in cur)m[k]=cur[k];for(k in pdfd)if(pdfd[k]!==''&&pdfd[k]!==undefined)m[k]=pdfd[k];
    ed.prefill=m;if(it.at&&ed.type!=='interconsulta')ed.at=toLocal(it.at);
    if(ed.type==='evolucion'&&it.svc&&!m.tit&&/egreso/i.test(it.svc)){m.tit='Egreso médico';}
    S.warned=false;render();
    var extra=items.length>1&&(ed.type==='lab'||ed.type==='img')?' El PDF trae '+items.length+' estudios: cargué el más reciente; para todos usa Importar PDF.':'';
    toast('PDF leído: revisa los campos y toca Guardar.'+extra);
  }).catch(function(e){toast(e&&e.message==='offline'?'La primera vez necesito internet para cargar el lector de PDF.':'No pude leer ese PDF.');});
}

var HXF=[['motivo','Motivo de consulta',2],['ea','Enfermedad actual',5],['ant','Antecedentes (patológicos, quirúrgicos, farmacológicos, alérgicos, familiares, tóxicos)',4],['rs','Revisión por sistemas',3],['ef','Examen físico',5],['para','Paraclínicos e imágenes',4],['dx','Diagnósticos y análisis',3],['plan','Plan y conducta',4],['otros','Otros (texto sin clasificar)',3]];
var HXR=[['motivo',/^motivo(\s+de\s+(la\s+)?consulta)?\b/i],['ea',/^(enfermedad\s+actual|ea)\b/i],['ant',/^(antecedentes|patol[oó]gicos|quir[uú]rgicos|farmacol[oó]gicos|al[eé]rgicos|familiares|t[oó]xicos|gineco)/i],['rs',/^(revisi[oó]n\s+por\s+sistemas|rs)\b/i],['ef',/^(examen\s+f[ií]sico|ef)\b/i],['para',/^(paracl[ií]nicos?|laboratorios?|im[aá]genes(\s+diagn[oó]sticas)?|ayudas\s+diagn[oó]sticas)\b/i],['dx',/^(an[aá]lisis|impresi[oó]n\s+diagn[oó]stica|diagn[oó]sticos?|dx)\b/i],['plan',/^(plan|conducta|manejo)\b/i]];
function parseHx(txt){
  var out={},cur='otros';
  String(txt).split(/\r?\n/).forEach(function(raw){
    var l=raw.replace(/^[\s#*•>\-]+/,'').replace(/\*+/g,'').trim();
    if(!l)return;
    for(var i=0;i<HXR.length;i++){var m=HXR[i][1].exec(l);if(m){cur=HXR[i][0];if(cur!=='ant')l=l.slice(m[0].length).replace(/^[\s:\-–.]+/,'');break;}}
    if(l)out[cur]=(out[cur]?out[cur]+'\n':'')+l;
  });
  return out;
}

  return h2+'</div>';

var SECS=[['res','Resumen'],['triage','Triage'],['consulta','Consulta'],['ingreso','Ingreso'],['evolucion','Evoluciones'],['plan','Plan'],['ic','Interconsultas'],['lab','Paraclínicos'],['img','Imágenes'],['task','Pendientes'],['nota','Notas aclaratorias'],['salida','Salida'],['cron','Cronología'],['upd','Importar PDF']];

var ANCH=['ingreso','evolucion','consulta','triage','epicrisis','salida','lab','img','interconsulta'];
function secOfType(t){return {consulta:'consulta',triage:'triage',traslado:'triage',ingreso:'ingreso',evolucion:'evolucion',nota:'nota',salida:'salida',epicrisis:'salida',interconsulta:'ic',lab:'lab',img:'img',plan:'plan'}[t]||'cron';}
function ofType(p,t){return pEntries(p.id).filter(function(e){return e.type===t;});}
function secCount(p,k){
  if(k==='hx')return HXF.filter(function(f){return (p.hx||{})[f[0]];}).length;
  if(k==='cron')return pEntries(p.id).filter(function(e){return e.type!=='plan';}).length;
  if(k==='ingreso'||k==='evolucion'||k==='nota'||k==='consulta')return ofType(p,k).length;
  if(k==='triage')return ofType(p,'triage').length+ofType(p,'traslado').length;
  if(k==='salida')return ofType(p,'salida').length+ofType(p,'epicrisis').length;
  if(k==='ic')return ofType(p,'interconsulta').length;
  if(k==='plan')return 0;
  if(k==='lab')return ofType(p,'lab').length;
  if(k==='img')return ofType(p,'img').length;

      '<div class="row"><div class="grow"><input id="newTask" placeholder="Ej. Revisar laboratorios de la mañana" data-enter="addTask" aria-label="Nuevo pendiente"></div><button class="btn sm primary" data-a="addTask">Agregar</button></div></div>';

function cut(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s;}
function handoffText(){
  var sv=db.services.filter(function(s){return S.hand==='all'||s.id===S.hand;});
  var d=new Date().toLocaleString('es-CO',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var out=[b('ENTREGA DE TURNO','SCHICHTÜBERGABE')+' · '+d,''];
  sv.forEach(function(s){
    var ps=activeOf(s.id).sort(function(a,b){return String(a.bed).localeCompare(String(b.bed),undefined,{numeric:true});});
    out.push('== '+s.name.toUpperCase()+' ('+ps.length+') ==');
    if(!ps.length)out.push(b('Sin pacientes activos.','Keine aktiven Patienten.'));
    ps.forEach(function(p){
      var es=pEntries(p.id);
      var ev=es.filter(function(e){return e.type==='evolucion';})[0];
      var ing=es.filter(function(e){return e.type==='ingreso';})[0];
      var pl=es.filter(function(e){return e.type==='plan';})[0];
      var res=ev&&ev.data.a?ev.data.a:(ing&&ing.data.imp?ing.data.imp:'');
      var plan=ev&&ev.data.p?ev.data.p:(pl&&pl.data.plan?pl.data.plan:(ing&&ing.data.plan?ing.data.plan:''));
      out.push(b('Cama','Bett')+' '+(p.bed||'—')+' · '+p.ini+' · '+p.age+b('a','J.')+' '+p.sex+' · '+b('día','Tag')+' '+hd(p)+' · ['+p.sev.toUpperCase()+(S.bi?' / '+(DE[p.sev]||'').toUpperCase():'')+']');
      out.push(b('Dx','Diagnose')+': '+(p.dx||'—'));
      if(res)out.push(b('Resumen','Zusammenfassung')+': '+cut(res,280));
      if(plan)out.push('Plan: '+cut(plan,280));
      var po=pendOrders(p.id);if(po.length)out.push(b('Resultados pendientes','Ausstehende Befunde')+': '+po.map(function(x){return x.o.n;}).join('; '));
      var ts=openTasks(p.id).map(function(t){return '- '+t.text;});
      var ics=openICs(p.id).map(function(e){return '- '+b('IC','Konsil')+' '+(e.data.serv||'')+': '+cut(e.data.preg,120);});
      if(ts.length||ics.length){out.push(b('Pendientes','Offene Aufgaben')+':');out=out.concat(ts,ics);}
      if(p.cont)out.push(b('Si pasa X, hacer Y','Wenn X, dann Y')+': '+cut(p.cont,200));
      out.push('');
    });
  });
  return out.join('\n');
}

function unDE(){

  Array.prototype.forEach.call(document.querySelectorAll('option[data-o]'),function(o){o.textContent=o.dataset.o;delete o.dataset.o;});
}
function applyDE(){
  unDE();
  var bb=document.getElementById('biBtn');if(bb)bb.setAttribute('aria-pressed',S.bi?'true':'false');
  if(!S.bi)return;
  var root=document.querySelector('.wrap'),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[],n;
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(n){
    var p=n.parentNode;if(!p||p.closest('dd,pre,textarea,.dx,.t,.dz,script,style,#biBtn,.tools,.tmodal,.tmsgs,#pres'))return;
    var raw=n.nodeValue,m=/^([‹+›✕]\s*)?([\s\S]*?)\s*$/.exec(raw),key=m?m[2]:raw.trim();
    if(!key)return;
    var de=deOf(key);if(!de)return;
    if(p.tagName==='OPTION'){if(!p.hasAttribute('value'))p.value=raw;p.dataset.o=raw;p.textContent=raw+' · '+de;return;}
    var sp=document.createElement('span');sp.className='dz';sp.appendChild(document.createTextNode(raw));
    var em=document.createElement('em');em.className='de';em.textContent=de;sp.appendChild(em);p.replaceChild(sp,n);
  });
}

  var ex={},marks=[],m;txt=String(txt||'').trim();if(!txt)return ex;
  EXMK.lastIndex=0;
  while((m=EXMK.exec(txt)))marks.push({i:m.index+m[1].length,e:m.index+m[0].length,l:m[2]});
  if(!marks.length){ex.otr=txt;return ex;}
  var head=txt.slice(0,marks[0].i).replace(/[\s.;]+$/,'').trim();
  function put(k,v,label){v=v.replace(/\s+/g,' ').replace(/^[-•*\s]+|[\s.;,]+$/g,'').trim();if(!v)return;v=v.charAt(0).toUpperCase()+v.slice(1);if(label)v=label+': '+v;ex[k]=ex[k]?ex[k]+'. '+v:v;}
  if(head)put('gen',head);
  marks.forEach(function(mk,ix){
    var seg=txt.slice(mk.e,ix+1<marks.length?marks[ix+1].i:txt.length),k=null,j;
    for(j=0;j<EXM.length;j++)if(EXM[j][0].test(mk.l)){k=EXM[j][1];break;}
    var lab=/^cuello$/i.test(mk.l)?'Cuello':(/^(cardiopulmonar|cardiovascular|pulmonar|cardio ?pulmonar)$/i.test(mk.l)?mk.l.charAt(0).toUpperCase()+mk.l.slice(1).toLowerCase():'');
    put(k||'otr',seg,lab);
  });
  return ex;
}

/* Divide "NOMBRE DEL CUPS OBSERVACIÓN" cuando la observación repite la primera palabra del nombre. */
function cupsSplit(txt){
  var w=norm2(txt).split(' ')[0],parts=txt.split(/\s+/),i,name=txt,obs='';
  if(w&&w.length>=5)for(i=2;i<parts.length;i++)if(norm2(parts[i])===w){name=parts.slice(0,i).join(' ');obs=parts.slice(i).join(' ');break;}
  return {name:name,obs:obs};
}
function husOrders(rows){ /* rows: líneas de la tabla EXÁMENES SOLICITADOS ya sin cabeceras */
  var out=[],cur=null;
  rows.forEach(function(t){
    var m=/^(\d{5,7}[A-Z]{0,3})\s*[-–]\s*(.+?)(?:\s+\d{1,2})?$/.exec(t);
    if(m){var sp=cupsSplit(m[2].replace(/\s+\d{1,2}$/,''));cur={cups:m[1].replace(/[A-Z]+$/,''),name:sp.name,obs:[sp.obs].filter(Boolean),inline:!!sp.obs,just:[]};out.push(cur);return;}
    if(cur){if(cur.inline&&!cur.just.length)cur.obs[0]+=' '+t;else if(!cur.obs.length)cur.obs.push(t);else cur.just.push(t);}
  });
  return out.map(function(o){
    var line=(o.obs[0]||o.name);
    return {cups:o.cups,name:sentence(o.name),line:capFix(sentence(line.replace(/\s+/g,' ').trim())),just:o.just.map(function(x){return capFix(sentence(x));}).join(' '),k:ordKind(o.name+' '+line)};
  });
}
var HDG_DROP=/^(CONDICIONES GENERALES|EL PACIENTE INGRESA AL PROGRAMA DE PREALTA|CODIGO NOMBRE|CUPS NOMBRE|NOMBRE DE MEDICAMENTOS|TIPO:)/;

/* kind: 'ev' (evolución) o 'eg' (egreso hospitalario médico). ls: líneas ya limpias (sin cabezal, sin nombres). */
function husEv(ls,kind){
  var B={s:[],vit:[],ef:[],a:[],ayu:[],p:[],amb:[],dx:[],ord:[],proc:[],egr:[]},sec='pre',seenVit=false,blk=null,recs=[],alarms=[],seen={},ambH='',dest='',barthel='',disp='',tit='',i,t,n,m;

    if(/^PROCEDIMIENTOS NO QUIRURGICOS SOLICITADOS$/.test(n)){open('proc');continue;}

    if(sec==='egr'||HDG_EGR.test(n)){
      if((m=/^El paciente egresa\s+(.+)$/i.exec(t)))dest=capFix(sentence(m[1]));

    if(sec==='s'&&!tit&&B.s.length===0&&/^(EVOLUCION\b|EGRESO MEDICO$|NOTA DE EVOLUCION)/.test(n)){tit=sentence(t);continue;}
    if(sec==='s'&&B.s.length<4&&/^DRA?\.?\s+\S+.*[-–]\s*\S+/i.test(t)&&t.length<80)continue;
    if(sec==='dx'){
      if((m=/^([A-Z]\d{2,3}[A-Z0-9]?)\s*[-–]\s*(.+)$/.exec(t))){B.dx.push(m[1]+' - '+sentence(m[2]));continue;}

  var ay=prose(B.ayu).replace(/^[-\s]+/,'');if(ay&&!/^sin reporte/i.test(ay))d.ayu=ay;else if(ay)d.ayu=ay;

  if(pl.length&&/^[-•*\s]*salida\.?$/i.test(pl[0])){disp='Salida';pl.shift();}
  var ord=[];
  /* exámenes ambulatorios: "Hemograma, PCR, función renal" -> una orden por nombre */

}
/* Folio 11: solicitud de procedimientos, insumos y/o medicamentos -> plan con órdenes pendientes */
function husSol(ls){

/* Folio 12: nota de descripción de procedimientos no quirúrgicos -> nota */

function husKind(title){

  if(/^CONSULTA EXTERNA/.test(n))return 'ev';

  if(/^EGRESO HOSPITALARIO MEDICO/.test(n))return 'eg';
  if(/^SOLICITUD DE PROCEDIMIENTOS/.test(n))return 'so';
  if(/^NOTA DESCRIPCION PROCEDIMIENTOS/.test(n))return 'np';
  if(/^(REGISTRO PROCEDIMIENTO QUIRURGICO|INFORME PROCEDIMIENTO|NOTA DE PROCEDIMIENTO|JUNTA|NOTA ACLARATORIA|REGISTRO HOJA PROCEDIMIENTO DE RADIOTERAPIA|DESCRIPCION QUIRURGICA|EPICRISIS)/.test(n))return 'nt';

}

function tcase(s){return String(s).toLowerCase().replace(/(^|\s)([a-záéíóúñ])/g,function(m,a,b){return a+b.toUpperCase();}).replace(/\b(De|Del|La|Los|Las|Y)\b/g,function(w){return w.toLowerCase();}).replace(/^./,function(c){return c.toUpperCase();});}
function husRole(title,sub){

  else if(/INGRESO A HOSPITALIZACION/.test(t))s='Hospitalización';

function importPdf(file,mode){
  if(!/\.pdf$/i.test(file.name)&&!/pdf/i.test(file.type)){toast('Solo archivos PDF.');return;}
  if(file.size>25e6){toast('El PDF pesa más de 25 MB.');return;}
  var forced=mode==='upd'?(val('updKind')||'auto'):'auto';
  toast('Leyendo el PDF…');
  pdfPages(file).then(function(pages){
    if(pages.join('').replace(/\s/g,'').length<40){toast('Este PDF no tiene texto (parece una foto o escaneo). Por ahora no leo imágenes.');return;}
    var r=((forced==='auto'||forced==='lab')&&labRep(pages))||((forced==='auto'&&isHus(pages))?analyzeHus(pages):analyzeAll(stripRepeats(pages),forced));
    if(mode==='new')applyPdfNew(r);else applyPdfUpd(r);
  }).catch(function(e){toast(e&&e.message==='offline'?'La primera vez necesito internet para cargar el lector de PDF.':'No pude leer ese PDF.');});
}

    return h+'<div class="small muted">La cuenta y la sincronización funcionan en el sitio publicado de Limonapp (no en esta vista previa). Entra desde la dirección de tu sitio.</div></div>';
  }
  var u=gUser();
  h+='<div class="small muted">Con tu cuenta de Google tus datos se guardan en el servidor de esta app, ligados a ti, y los abres en cualquier dispositivo. Las iniciales, la cama y el contenido de las historias que importes quedan allí: no escribas nombres, cédulas ni teléfonos.</div>';
  if(!gCons())h+='<label style="flex-direction:row;align-items:flex-start;gap:8px"><input type="checkbox" data-a="gCons" aria-label="Acepto"><span class="small">Entiendo que mis datos clínicos se guardarán en el servidor de Limonapp, asociados a mi cuenta, y que soy responsable de no incluir datos que identifiquen a pacientes.</span></label>';
  h+='<div class="small muted"><a href="privacidad.html" target="_blank" rel="noopener">Política de privacidad</a> · <a href="terminos.html" target="_blank" rel="noopener">Términos de servicio</a></div>';
  if(u){
    h+='<div class="note">'+(G.st==='busy'?'Sincronizando…':G.st==='err'?esc(G.msg):'Sesión iniciada: '+esc(u.email||'')+(gSt().when?'. Última sincronización: '+esc(fmt(gSt().when)):''))+'</div>';
    h+='<div class="row"><button class="btn primary" data-a="gSync"'+(gCons()?'':' disabled')+'>Sincronizar ahora</button><button class="btn danger" data-a="gLogout">Cerrar sesión</button></div>';
    h+='<div class="small muted">Se sincroniza solo unos segundos después de cada cambio. Si borras todo aquí, también se borra en tu cuenta en la siguiente sincronización.</div>';
  }else{
    h+='<div class="row"><button class="btn primary" data-a="gLogin"'+(G.ok?'':' disabled')+'>'+(G.ok?'Entrar con Google':'Cargando…')+'</button></div>';
    if(G.st==='err')h+='<div class="note bad">'+esc(G.msg)+'</div>';
  }
  return h+'</div>';
}

var PXF={
 L:['X....','X....','X....','X....','X....','X....','XXXXX'],
 I:['XXXXX','..X..','..X..','..X..','..X..','..X..','XXXXX'],
 M:['X...X','XX.XX','X.X.X','X.X.X','X...X','X...X','X...X'],
 O:['.XXX.','X...X','X...X','X...X','X...X','X...X','.XXX.'],
 N:['X...X','XX..X','X.X.X','X..XX','X...X','X...X','X...X'],
 A:['.XXX.','X...X','X...X','XXXXX','X...X','X...X','X...X'],
 P:['XXXX.','X...X','X...X','XXXX.','X....','X....','X....']
};
function pixTitle(h){
  var word='LIMONAPP',x=0,y='',s='',i,r,c,g,cls;
  for(i=0;i<word.length;i++){
    g=PXF[word[i]];cls=i<5?'pl-y':'pl-g';
    for(r=0;r<7;r++)for(c=0;c<5;c++)if(g[r][c]==='X'){s+='<rect class="pl-s" x="'+(x+c+1)+'" y="'+(r+1)+'" width="1" height="1"/>';y+='<rect class="'+cls+'" x="'+(x+c)+'" y="'+r+'" width="1" height="1"/>';}
    x+=6;
  }
  var w=x-1+1;
  return '<svg class="pixt" viewBox="0 0 '+(w+1)+' 8" height="'+h+'" role="img" aria-label="Limonapp" shape-rendering="crispEdges">'+s+y+'</svg>';
}
var LEMON=['....GG....','...GG.....','..YYYYYY..','.YYWYYYYY.','YYWYYYYYYY','YYYYYYYYYY','YYYYYYYYYD','.YYYYYYDD.','..YYDDDD..'];
function pixLemon(px){
  var s='';LEMON.forEach(function(row,r){for(var c=0;c<row.length;c++){var k=row[c];if(k!=='.')s+='<rect class="pq-'+k+'" x="'+c+'" y="'+r+'" width="1" height="1"/>';}});
  return '<svg class="pixl" viewBox="0 0 10 9" height="'+px+'" aria-hidden="true" shape-rendering="crispEdges">'+s+'</svg>';
}
function pxOn(){try{return localStorage.getItem('rot_px')!=='0';}catch(e){return true;}}
function pxApply(){document.documentElement.classList.toggle('px',pxOn());var b=document.getElementById('pxBtn');if(b)b.setAttribute('aria-pressed',pxOn()?'true':'false');}
function brandInit(){var h=document.querySelector('.brand h1');if(h)h.innerHTML=pixTitle(24);}
/* ----- asistente de ayuda (sin IA: respuestas escritas de antemano) ----- */
var HELP=[
 {t:'Crear un servicio o rotación',kw:['servicio','rotacion','crear servicio','nueva rotacion','agregar servicio','nuevo servicio'],a:'En la pestaña Servicios, abajo, está la tarjeta “Nuevo servicio o rotación”: escribe el nombre (Urología, Cirugía pediátrica…) y toca Agregar. Para renombrarlo o borrarlo, entra al servicio.',go:[['Ir a Servicios','nav:services']]},
 {t:'Agregar un paciente',kw:['paciente','nuevo paciente','agregar paciente','crear paciente','anadir paciente','cama'],a:'Entra a un servicio y toca “+ Paciente”. Escribe iniciales, edad, cama, los 3 últimos dígitos de la historia, fecha de ingreso, diagnóstico y gravedad, y toca Guardar. No pongas nombre, cédula ni teléfono.',go:[['Ir a Servicios','nav:services']]},
 {t:'Mi institución no aparece en la lista',kw:['institucion','hospital','formato','otro hospital','clinica','no aparece','selector','hus'],a:'Por ahora la app solo trae el formato del HUS (Hospital Universitario de Santander). Si quieres que entienda las historias de tu institución, escribe al correo que aparece junto al selector de institución. Mientras tanto puedes usar la opción del HUS: leerá lo que pueda de cualquier PDF con texto.'},
 {t:'Importar una historia en PDF (paciente nuevo)',kw:['pdf','importar','subir historia','cargar','archivo','historia clinica','arrastrar'],a:'Entra a un servicio, toca “+ Paciente” y suelta el PDF en la zona punteada (o “elige el archivo”). La app llena la historia, la última evolución y el resto de registros; revisa los datos y toca Guardar. El PDF se lee en tu dispositivo, no se sube a ningún lado.',go:[['Ir a Servicios','nav:services']]},
 {t:'Agregar más información a un paciente con otro PDF',kw:['actualizar','agregar pdf','otro pdf','nuevo pdf','sumar','importar pdf paciente','actualizar pdf'],a:'Abre al paciente, ve a la sección “Importar PDF”, suelta el archivo y marca lo que quieres agregar. Nada se borra ni se reemplaza; lo que ya estaba guardado aparece desmarcado.',go:[['Ir a Importar PDF','sec:upd']]},
 {t:'El PDF no se lee o no reconoce nada',kw:['no lee','no reconoce','escaneado','foto','vacio','no funciona pdf','error pdf','no detecta','sin texto'],a:'La app solo lee PDF con texto (los que genera el software del hospital). Un escaneo o una foto no trae texto y no se puede leer. Si el PDF sí tiene texto y no reconoce nada, en “Importar PDF” del paciente elige el tipo de documento en la lista en vez de “Detectar solo”. Si sigue fallando, cuéntaselo a quien administra la app.',go:[]},
 {t:'Paraclínicos o imágenes vacíos',kw:['paraclinicos','imagenes','laboratorios','lab vacio','no salen','vacios','examenes'],a:'Los resultados se extraen de las evoluciones y notas del PDF. Si faltan, abre al paciente → “Importar PDF” y vuelve a subir el archivo (suma lo que falte sin duplicar). También puedes agregarlos a mano en Paraclínicos o Imágenes con “+ Agregar”.',go:[['Ir a Importar PDF','sec:upd'],['Ir a Paraclínicos','sec:lab']]},
 {t:'Fechas con ~ o fechas equivocadas',kw:['fecha','fechas','~','impresion','dia','hora'],a:'La app usa la fecha de registro de cada documento, nunca la de impresión del PDF. Una “~” significa que el PDF no traía una fecha clara y la app la estimó. Abre la nota, toca Editar y corrige la fecha.',go:[]},
 {t:'Qué es el Resumen',kw:['resumen','estado actual','lectura rapida','problemas','tendencias','hitos'],a:'Es la primera pantalla de cada paciente: el último registro clínico, una lectura rápida del contenido, la lista de problemas (CIE-10), tendencias de laboratorio (creatinina, hemoglobina…), hitos y pendientes. Se calcula automáticamente del texto del PDF: confírmalo siempre con la historia original.',go:[['Ir al Resumen','sec:res']]},
 {t:'Buscar o filtrar en la Cronología',kw:['cronologia','buscar','filtrar','filtro','encontrar','busqueda','nota antigua'],a:'La Cronología reúne todo lo del paciente en orden de fecha. Usa los botones por tipo (Evolución, Ingreso, Paraclínico…) y el buscador de arriba (por ejemplo “sonda” o “creatinina”). Los registros están agrupados por mes; toca uno para abrirlo.',go:[['Ir a Cronología','sec:cron']]},
 {t:'Perfil y equipo',kw:['perfil','foto','equipo','colegas','codigo','invitacion','en turno','turno','usuario','cargo','servicio'],a:'En la pestaña Equipo (con sesión iniciada) creas tu perfil: foto, nombre, nombre de usuario, cargo, servicio y si estás en turno. Tu especialidad o rango (Est., Int., Res., MG…) es obligatoria y va al comienzo de tu nombre. Puedes crear o unirte a varios equipos con su código y cambiar entre ellos; solo las personas de cada equipo ven tu perfil y el chat de ese equipo.',go:[['Ir a Equipo','nav:team']]},
 {t:'Enviar un paciente a un colega',kw:['enviar paciente','pasar paciente','compartir paciente','colega','historia completa','sincronizar paciente','compartido'],a:'Abre el paciente y toca “Enviar a un colega”. Le llega con su historia, notas, paraclínicos y pendientes (sin nombre ni cédula). Al aceptarlo elige en qué servicio lo quiere. Desde entonces, los cambios que cualquiera haga se ven en ambos, y en la lista aparece “Compartido · actualizado por…”. Si no quieres seguir recibiendo cambios, usa “Dejar de compartir conmigo”.'},
 {t:'Mover un paciente de servicio',kw:['mover','mover paciente','cambiar de servicio','otro servicio','trasladar'],a:'En la ficha del paciente toca “Mover de servicio” y elige el servicio (o crea uno). Solo cambia dónde lo ves tú: tus colegas lo siguen viendo en su propio servicio, y la información clínica sigue sincronizada.'},
 {t:'Estados de turno',kw:['turno','en turno','descanso','fuera de turno','estado','verde','rojo','ambar','indicador'],a:'El indicador de color de arriba muestra tu estado ante tus colegas: verde en turno, ámbar en descanso (receso, almuerzo, cena, dormir) y rojo fuera de turno. Tócalo para cambiarlo. Si eres interno o estudiante, al ponerte en turno te pregunta en qué servicio estás.'},
 {t:'Chat del equipo',kw:['chat','mensaje','mensajes','escribir','notificacion','notificaciones','aviso'],a:'El chat está en Equipo → Chat: un grupo para todo el equipo y mensajes privados con cada colega. Se actualiza solo cada pocos segundos mientras tienes la app abierta; no manda avisos al teléfono cuando está cerrada. Úsalo solo para asuntos médicos y laborales y sin datos que identifiquen pacientes.'},
 {t:'Administradores y miembros del equipo',kw:['administrador','admin','expulsar','retirar','sacar','miembros','quitar miembro','invitar','agregar miembro'],a:'Quien crea el equipo es el creador y puede nombrar o quitar administradores (en Equipo → Colegas → Hacer admin). Los administradores pueden cambiar el nombre del equipo, ver el código, invitar personas, retirar miembros y borrar mensajes de cualquiera. Un administrador no puede retirar a otro administrador: solo el creador. Para agregar a alguien, búscalo en Buscar personas y toca Invitar: le llega una invitación y decide si entra.'},
 {t:'Buscar personas y mensajes directos',kw:['buscar usuario','buscar persona','escribir a alguien','mensaje directo','directo','encontrar colega','buscar colega'],a:'En Equipo, abre Buscar personas, escribe al menos 3 letras del nombre, usuario, cargo o servicio y toca Escribir para abrir una conversación directa. En tu perfil puedes desactivar “Permitir que otros usuarios me encuentren”. Para dejar de ver una conversación directa, tócala y elige Ocultar conversación.'},
 {t:'Emojis en el chat',kw:['emoji','emojis','carita','caritas','reaccion'],a:'En el chat toca el botón de la carita junto al cuadro de texto, elige un emoji y se inserta donde está el cursor. También puedes usar el teclado de emojis de tu celular.'},
 {t:'Modo ronda',kw:['ronda','modo ronda','presentar paciente','excluir de la ronda','quitar de la ronda','cama ascendente','corto','largo'],a:'Desde el inicio o desde un servicio toca Ronda. Elige orden por cama (ascendente o descendente), detalle corto o largo, y ver todos o uno a uno. En “Pacientes en esta ronda” desmarca a quienes no vas a presentar (solo es tu elección). Cada paciente muestra sus pendientes y un campo para anotar lo que pide el doctor: queda como pendiente marcado “Ronda”.'},
 {t:'Historial de cambios de un paciente compartido',kw:['historial de cambios','quien cambio','registro de cambios','auditoria','quien modifico','paciente compartido cambios'],a:'En un paciente compartido, el cuadro “Historial de cambios” lista cada cambio con fecha, hora, nombre y cargo de quien lo hizo (por ejemplo, agregó un paraclínico o modificó el diagnóstico). El registro llega unos segundos después del cambio y agrupa los cambios repetidos del mismo autor en 10 minutos.'},
 {t:'Número de historia clínica y buscador',kw:['numero de historia','historia clinica numero','cedula','buscar paciente','buscador','hc'],a:'En la ficha del paciente puedes guardar el número de historia clínica. Queda solo en tu dispositivo: no se comparte con colegas ni se envía en resúmenes. En el inicio, el buscador encuentra pacientes por ese número (mínimo 3 dígitos), por iniciales o por cama.'},
 {t:'PDF de la entrega de turno',kw:['pdf entrega','entrega pdf','descargar entrega','enviar entrega','pdf de entrega'],a:'En Entrega elige el servicio y toca Descargar PDF, Compartir o Enviar por el chat. Puedes incluir el número de historia clínica de cada paciente marcando la casilla.'},
 {t:'Actualizar la app en el iPhone',kw:['actualizar','refrescar','recargar','reiniciar','iphone','pantalla de inicio','no carga','version nueva'],a:'Toca el botón Actualizar (flecha circular) arriba: guarda tus datos, busca la versión nueva y recarga la app. Así no tienes que cerrarla y abrirla.'},
 {t:'La sesión se cierra o sale un error al entrar',kw:['sesion se cierra','se desconecta','error al entrar','error al iniciar','otro dispositivo sesion','simultanea'],a:'La sesión es independiente en cada dispositivo: iniciar sesión en el computador no debería cerrar la del celular. Si ves un error justo al iniciar, la app reintenta sola unos segundos. Si Google te abre una pestaña del navegador y no vuelves a la app instalada, cierra esa pestaña, abre la app instalada y toca de nuevo “Entrar con Google”. Si la sesión venció, ve a Cuenta → Cerrar sesión y entra de nuevo: tus datos locales no se pierden.'},
 {t:'Interconsultas pendientes',kw:['interconsulta','interconsultas','respondida','pendiente interconsulta','ic'],a:'Las interconsultas están en su sección. Toca “Pendiente: marcar respondida” cuando llegue la respuesta. Las pendientes también aparecen en la pestaña Pendientes.',go:[['Ir a Interconsultas','sec:ic']]},
 {t:'Pendientes del turno',kw:['pendientes','tareas','por hacer','lista de tareas','turno'],a:'Dentro de cada paciente, la sección Pendientes guarda sus tareas. La pestaña Pendientes (arriba) reúne las de todos tus pacientes activos.',go:[['Ir a Pendientes','nav:tasks']]},
 {t:'Entrega de turno',kw:['entrega','entrega de turno','reporte','copiar entrega','handoff'],a:'En la pestaña Entrega se arma un texto con tus pacientes activos y sus pendientes. Elige el servicio y toca copiar para pegarlo donde lo necesites.',go:[['Ir a Entrega','nav:handoff']]},
 {t:'Respaldo y restaurar',kw:['respaldo','backup','copia de seguridad','restaurar','recuperar','exportar','guardar copia'],a:'En Cuenta toca “Generar respaldo” y copia el texto (guárdalo en tus notas o envíatelo). Para restaurar, pégalo en “Importar”: reemplaza lo que haya en ese dispositivo. Hazlo con frecuencia, sobre todo antes de borrar datos del navegador.',go:[['Ir a Cuenta','nav:backup']]},
 {t:'Iniciar sesión y sincronizar',kw:['login','logeo','sesion','iniciar sesion','entrar','cuenta','google','sincronizar','sincronizacion','correo','registrarme','registrar'],a:'Ve a Cuenta → “Cuenta y sincronización”. Marca el aviso de datos y toca “Entrar con Google”. Desde ahí tus datos se guardan en tu cuenta y se sincronizan solos unos segundos después de cada cambio. Funciona en el sitio publicado de Limonapp.',go:[['Ir a Cuenta','nav:backup']]},
 {t:'Mis datos no aparecen en otro dispositivo',kw:['otro dispositivo','otro celular','otro computador','no aparecen','no sincroniza','no se sincroniza','celular','computador'],a:'Entra al mismo sitio, ve a Cuenta e inicia sesión con la misma cuenta. Marca el aviso de datos y toca “Sincronizar ahora”. Si ese dispositivo tenía datos propios, la app los combina con los de tu cuenta sin borrar nada.',go:[['Ir a Cuenta','nav:backup']]},
 {t:'Cerrar sesión',kw:['cerrar sesion','salir','logout','desconectar'],a:'En Cuenta → “Cuenta y sincronización” toca “Cerrar sesión”. Tus datos siguen en ese dispositivo y en tu cuenta.',go:[['Ir a Cuenta','nav:backup']]},
 {t:'Instalar la app en el celular',kw:['instalar','pantalla de inicio','app movil','instalarla','icono','pwa'],a:'En Chrome (Android): menú ⋮ → “Instalar app”. En iPhone (Safari): botón Compartir → “Añadir a pantalla de inicio”. Se abre como una app normal.',go:[]},
 {t:'Tema, idioma y estilo 8-bit',kw:['tema','oscuro','claro','idioma','aleman','deutsch','8 bit','8-bit','estilo','letra'],a:'En la parte de arriba: ☾ cambia entre tema oscuro y claro, “DE” muestra u oculta el alemán junto al español, y el botón “8” activa o quita el estilo 8-bit si prefieres letra más sobria.',go:[]},
 {t:'Dar de alta o egresar a un paciente',kw:['egreso','egresar','alta','salida','dar de alta','egresado'],a:'Dentro del paciente toca “+ Agregar” → Salida, elige el tipo y el destino, y guarda: el paciente pasa a “Egresados”. Si fue un error, ábrelo y toca Reactivar.',go:[['Ir a Cronología','sec:cron']]},
 {t:'Copiar la evolución anterior',kw:['copiar evolucion','evolucion anterior','nueva evolucion','evolucion','copiar'],a:'Abre la sección Evoluciones, toca “+ Agregar” y, en el formulario, usa “Partir de la evolución anterior”. Así solo editas lo que cambió.',go:[['Ir a Evoluciones','sec:evolucion']]},
 {t:'Editar o borrar una nota',kw:['editar','corregir','modificar','borrar nota','eliminar nota','cambiar nota'],a:'Abre el registro en su sección (o en la Cronología) y usa Editar o Borrar (te pide confirmar). Para corregir o agregar algo a un folio ya emitido, toca “Aclarar” en su tarjeta: crea una nota aclaratoria anclada a ese folio.',go:[['Ir a Cronología','sec:cron'],['Ir a Notas aclaratorias','sec:nota']]},
 {t:'Editar los datos del paciente',kw:['editar paciente','cambiar cama','cambiar diagnostico','datos del paciente','gravedad','iniciales'],a:'En el Resumen del paciente toca “Editar datos” para cambiar iniciales, cama, ingreso, diagnóstico o gravedad.',go:[['Ir al Resumen','sec:res']]},
 {t:'Urgencias: triage, observación y paso a hospitalización',kw:['urgencias','triage','observacion','hospitalizar','hospitalizacion','pasar a hospitalizacion','ingreso urgencias'],a:'En Servicios toca “Urgencias · observación” y luego “+ Paciente a urgencias”: guardas los datos y se abre el Triage; después registras el Ingreso y las Evoluciones de la observación. Para hospitalizar, marca a los pacientes en la lista de Urgencias, elige el servicio y toca “Pasar a hospitalización”, o usa ese botón dentro de un paciente.',go:[['Ir a Urgencias','nav:urg']]},
 {t:'Consulta externa (primera vez o control)',kw:['consulta','consulta externa','primera vez','control','ambulatoria','ambulatorio'],a:'Dentro de un paciente toca “+ Consulta externa” (o crea el paciente con atención “Consulta externa”). Eliges si es primera vez o control, escribes el médico que atiende y la historia. Queda en la Cronología marcada como consulta externa, junto con urgencias y hospitalización; ahí puedes filtrar por tipo de atención.'},
 {t:'Exportar el censo a Word',kw:['censo','word','docx','exportar','imprimir','descargar historia'],a:'En un servicio toca “Exportar censo (Word)”: descarga un documento con una tabla de camas y, por paciente, todo en orden cronológico (ingreso, evoluciones, consultas, interconsultas, paraclínicos, imágenes, notas aclaratorias y pendientes). Dentro de un paciente, “Exportar HC (Word)” baja solo su historia. Lleva solo iniciales y los últimos 3 dígitos de la HC. Las fotos de las imágenes no van en el documento, solo sus lecturas.'},
 {t:'Procedimientos en el plan',kw:['procedimiento','procedimientos','cups','cirugia','solicitar procedimiento'],a:'En el Plan, el Ingreso, las Evoluciones y la Consulta hay una casilla “Procedimientos solicitados”: escribe uno por línea. Debajo puedes buscar en el catálogo (código CUPS o nombre) y tocar el resultado para añadirlo. Si no aparece, déjalo escrito a mano; se guarda igual y sale en el censo en Word.'},
 {t:'Asistente de IA con tu propia cuenta',kw:['ia','inteligencia artificial','claude','chatgpt','openai','gemini','api','clave','asistente'],a:'Si el administrador te aprobó, en Cuenta > Asistente de IA queda “IA de Limonapp (sin clave)”: marca la casilla de aceptación, toca Guardar y úsala desde el botón “Asistente IA” de la nota (tope: 15 usos al día y 200 al mes por persona; el texto pasa por el servidor de Limonapp y por Google, y no se guarda). Si prefieres usar tu propia cuenta: eliges proveedor (Claude, OpenAI o Gemini), pegas tu clave API y tocas Guardar y Probar conexión. Luego, al escribir una nota, toca “Asistente IA”: si seleccionaste un fragmento envía solo ese fragmento, si no, el campo donde estabas. Ves y editas el texto antes de enviarlo, eliges qué quieres (corregir, ordenar en SOAP, revisar coherencia, resumen de entrega, alemán…) y la respuesta la copias o la pones en el campo. La clave queda solo en este dispositivo. No envíes nombres, cédulas ni teléfonos.'},
 {t:'Borrar un paciente o el ejemplo',kw:['borrar paciente','eliminar paciente','ejemplo','demo','borrar servicio'],a:'Para un paciente: abre su Resumen y toca “Borrar paciente” (pide confirmación). El paciente de ejemplo se quita desde Cuenta → “Borrar el ejemplo”.',go:[['Ir a Cuenta','nav:backup']]},

function ptSummary(p){
  var es=pEntries(p.id),ev=es.filter(function(e){return e.type==='evolucion';})[0],ing=es.filter(function(e){return e.type==='ingreso';})[0],pl=es.filter(function(e){return e.type==='plan';})[0];
  var res=ev&&ev.data.a?ev.data.a:(ing&&ing.data.imp?ing.data.imp:'');
  var plan=ev&&ev.data.p?ev.data.p:(pl&&pl.data.plan?pl.data.plan:(ing&&ing.data.plan?ing.data.plan:''));
  var ts=openTasks(p.id).map(function(t){return t.text;}),ics=openICs(p.id).map(function(e){return 'Interconsulta '+(e.data.serv||'')+': '+cut(e.data.preg,120);});
  return {ini:p.ini,age:p.age,sex:p.sex,bed:p.bed,dx:p.dx||'',sev:p.sev,day:hd(p),res:cut(res,500),plan:cut(plan,500),tasks:ts.concat(ics).slice(0,15),cont:p.cont||''};
}
function ptScrub(s){return String(s||'').replace(/\b\d{7,}\b/g,'[número omitido]');}
function ptText(s){
  var o=['Cama '+(s.bed||'—')+' · '+s.ini+' · '+s.age+' a '+s.sex+' · día '+s.day+' · ['+String(s.sev||'').toUpperCase()+']','Dx: '+(s.dx||'—')];
  if(s.res)o.push('Resumen: '+s.res);if(s.plan)o.push('Plan: '+s.plan);
  if(s.tasks.length){o.push('Pendientes:');s.tasks.forEach(function(t){o.push('- '+t);});}
  if(s.cont)o.push('Si pasa X, hacer Y: '+cut(s.cont,200));
  return ptScrub(o.join('\n'));
}

var CR={im:null,cx:0,cy:0,z:1,drag:null};
function crScale(){return Math.max(260/CR.im.width,260/CR.im.height)*CR.z;}
function crClamp(){var sc=crScale(),hx=130/sc,hy=130/sc;CR.cx=Math.min(CR.im.width-hx,Math.max(hx,CR.cx));CR.cy=Math.min(CR.im.height-hy,Math.max(hy,CR.cy));}
function crDraw(){
  var c=document.getElementById('cvs');if(!c||!CR.im)return;crClamp();var x=c.getContext('2d'),sc=crScale();
  x.fillStyle='#000';x.fillRect(0,0,260,260);x.drawImage(CR.im,CR.cx-130/sc,CR.cy-130/sc,260/sc,260/sc,0,0,260,260);
}
function tPhotoProcess(file){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    CR.im=im;CR.cx=im.width/2;CR.cy=im.height/2;CR.z=1;tModalClose();
    var d=document.createElement('div');d.id='tModal';d.className='tmodal';d.setAttribute('role','dialog');
    d.innerHTML='<div class="tbox"><h3>Ajusta tu foto</h3><div class="cropw"><canvas id="cvs" width="260" height="260"></canvas><div class="cropmask"></div></div><label>Zoom<input type="range" id="cz" min="1" max="4" step="0.01" value="1"></label><div class="small muted">Arrastra la imagen para encuadrar tu cara. Lo que queda dentro del círculo es lo que se verá.</div><div class="row"><button class="btn primary" data-a="cropOk">Usar foto</button><button class="btn" data-a="cropX">Cancelar</button></div></div>';
    document.body.appendChild(d);crDraw();
    var c=document.getElementById('cvs');
    c.addEventListener('pointerdown',function(e){CR.drag={x:e.clientX,y:e.clientY};try{c.setPointerCapture(e.pointerId);}catch(_){}});
    c.addEventListener('pointermove',function(e){if(!CR.drag)return;var k=260/c.getBoundingClientRect().width,sc=crScale();CR.cx-=(e.clientX-CR.drag.x)*k/sc;CR.cy-=(e.clientY-CR.drag.y)*k/sc;CR.drag={x:e.clientX,y:e.clientY};crDraw();});
    c.addEventListener('pointerup',function(){CR.drag=null;});c.addEventListener('pointercancel',function(){CR.drag=null;});
    document.getElementById('cz').addEventListener('input',function(e){CR.z=parseFloat(e.target.value)||1;crDraw();});
  };im.onerror=function(){toast('No pude leer esa imagen.');};im.src=String(fr.result);};
  fr.readAsDataURL(file);
}
function crOut(){
  var n=144,o=document.createElement('canvas');o.width=n;o.height=n;var x=o.getContext('2d'),sc=crScale();
  x.drawImage(CR.im,CR.cx-130/sc,CR.cy-130/sc,260/sc,260/sc,0,0,n,n);
  var q=.85,u=o.toDataURL('image/jpeg',q);while(u.length>42000&&q>.3){q-=.1;u=o.toDataURL('image/jpeg',q);}
  return u.length>44000?null:u;
}

function tourFirstPatient(){var ps=db.patients.filter(function(p){return p.active;});return (S.serviceId&&ps.filter(function(p){return p.serviceId===S.serviceId;})[0])||ps[0]||db.patients[0];}
function tourPre(st){
  if(!st||!st.pre)return;
  if(st.pre==='services'){if(S.view!=='services')go('services');return;}
  if(st.pre==='service'){
    if(S.view==='service')return;
    if(S.view==='patient'&&S.serviceId){go('service',{serviceId:S.serviceId,filter:'activos'});return;}
    var s=db.services.filter(function(x){return activeOf(x.id).length;})[0]||db.services[0];if(s)go('service',{serviceId:s.id,filter:'activos'});return;
  }
  if(st.pre==='patient'){
    if(S.view!=='patient'){var p=tourFirstPatient();if(p)go('patient',{patientId:p.id,serviceId:p.serviceId});}
    if(S.view==='patient'&&st.sec&&S.sec!==st.sec){S.sec=st.sec;render();}
  }
}
function tourGo(i){
  if(i<0||i>=TOUR.length)return;
  tourI=i;tourPre(TOUR[i]);tourShow();
}
function tourEl(st){return st&&st.s?document.querySelector(st.s):null;}

  var el=tourEl(st);
  if(el&&el.scrollIntoView){try{el.scrollIntoView({block:'center',behavior:'instant'});}catch(e){el.scrollIntoView();}}
  requestAnimationFrame(function(){tourPlace(el,fresh);c.style.visibility='visible';});

function tourPlace(el,fresh){
  var sp=document.getElementById('tsp'),c=document.getElementById('tcard');if(!sp||!c)return;
  if(fresh)sp.style.transition='none';
  var vw=window.innerWidth,vh=window.innerHeight,cw=Math.min(380,vw-24);c.style.width=cw+'px';
  if(!el){sp.style.cssText='left:50%;top:50%;width:0;height:0'+(fresh?';transition:none':'');c.style.left=((vw-cw)/2)+'px';c.style.top=Math.max(16,(vh-c.offsetHeight)/2-20)+'px';}
  else{
    var r=el.getBoundingClientRect(),pd=6;
    sp.style.cssText='left:'+(r.left-pd)+'px;top:'+(r.top-pd)+'px;width:'+(r.width+2*pd)+'px;height:'+(r.height+2*pd)+'px'+(fresh?';transition:none':'');
    var ch=c.offsetHeight,top=r.bottom+pd+12;if(top+ch>vh-8)top=Math.max(8,r.top-pd-12-ch);
    c.style.top=top+'px';c.style.left=Math.max(12,Math.min(vw-cw-12,r.left))+'px';
  }
  if(fresh){void sp.offsetWidth;sp.style.transition='';}
}

/* ---------- diagnóstico vacío ("Diagnósticos:") ---------- */
var DXH=/^(diagn[oó]sticos?|an[aá]lisis)\s*:?\s*$/i;
function dxClean(l){return cut(String(l).replace(/^[\s*\-–—•]+/,'').replace(/^[A-Z]\d+[A-Z0-9.]*\s*-\s*/,'').trim(),140);}
function dxFromHx(t){var src=String(t||'').split('\n');for(var i=0;i<src.length;i++){var l=src[i].replace(/^[\s*\-–—•]+/,'').trim();if(l&&!DXH.test(l))return dxClean(l);}return '';}
function migDx(){
  var ch=0;db.patients.forEach(function(p){
    if(!DXH.test(String(p.dx||'')))return;
    var n=(p.hx&&p.hx.dx&&dxFromHx(p.hx.dx))||(problemList(p)[0]?dxClean(problemList(p)[0]):'');
    if(n!==p.dx){p.dx=n;ch++;}
  });
  if(ch){db.meta.mod=new Date().toISOString();persist();}
}

/* ---------- tendencias grandes ---------- */
function dshort(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);return m?m[3]+'/'+m[2]:d;}
function bigTrend(pts,T){
  var n=pts.length,vs=pts.map(function(x){return x.v;}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var pad=(mx-mn)*0.2||Math.abs(mx)*0.1||1,lo=mn-pad,hi=mx+pad;
  var gap=n<=12?68:56,W=Math.max(640,n*gap+90),H=310,L=54,R=26,Tp=36,B=66,iw=W-L-R,ih=H-Tp-B;
  var multiYear=pts[0].d.slice(0,4)!==pts[n-1].d.slice(0,4);
  function X(i){return n===1?L+iw/2:L+i*(iw/(n-1));}
  function Y(v){return Tp+ih-(v-lo)/(hi-lo)*ih;}
  function f(v){return Math.abs(v)>=100?String(Math.round(v)):(Math.round(v*10)/10).toString();}
  function dl(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);return m?m[3]+'/'+m[2]+(multiYear?'/'+m[1].slice(2):''):d;}
  var g='',i;
  for(i=0;i<=4;i++){var v=lo+(hi-lo)*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+f(v)+'</text>';}
  var xy=pts.map(function(p,k){return [X(k),Y(p.v)];});
  var dots='',labs='',xl='',gp='';
  xy.forEach(function(a,k){
    dots+='<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="'+(k===n-1?5:3.8)+'" class="pt"/>';
    var up=!(k>0&&k<n-1&&pts[k].v<pts[k-1].v&&pts[k].v<pts[k+1].v);   /* en un valle el número va debajo para no tapar la línea */
    labs+='<text x="'+a[0].toFixed(1)+'" y="'+(up?a[1]-11:a[1]+20).toFixed(1)+'" text-anchor="middle" class="vl">'+f(pts[k].v)+'</text>';
    xl+='<text transform="translate('+a[0].toFixed(1)+','+(H-B+18)+') rotate(-40)" text-anchor="end" class="ax">'+dl(pts[k].d)+'</text>';
    if(k>0){var dd=Math.round((new Date(pts[k].d+'T12:00')-new Date(pts[k-1].d+'T12:00'))/864e5);gp+='<text x="'+((xy[k-1][0]+a[0])/2).toFixed(1)+'" y="'+(Tp+ih-6)+'" text-anchor="middle" class="gp">'+(dd>=1?'+'+dd+' d':'mismo día')+'</text>';}
  });
  return '<div class="bigw"><svg class="bigsvg" viewBox="0 0 '+W+' '+H+'" style="width:'+W+'px" role="img" aria-label="Tendencia de '+esc(T.n)+': '+n+' valores">'+g+gp+(n>1?'<polyline class="ln" points="'+xy.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1);}).join(' ')+'"/>':'')+dots+labs+xl+'</svg></div>';
}
function trendsCards(p){
  var cs=TRENDS.map(function(T){var pts=trendPts(p,T);return pts.length?{T:T,pts:pts}:null;}).filter(Boolean);
  if(!cs.length)return '';
  return '<details class="card trbig" open><summary><h3 style="display:inline">Tendencias ('+cs.length+')</h3> <span class="muted small">gráficas con fecha y valor de cada punto</span></summary>'+cs.map(function(c){
    var a=c.pts[0],b=c.pts[c.pts.length-1];
    return '<div class="trblk"><div class="trh"><strong>'+esc(c.T.n)+'</strong> <span class="muted small">'+esc(c.T.u)+'</span>'+(c.pts.length>1?' <span class="small">'+a.v+' → '+b.v+'</span>':'')+'</div>'+bigTrend(c.pts,c.T)+
      '<div class="small muted">'+esc(c.T.h)+'</div><details class="small"><summary>Ver valores</summary><div class="trvals">'+c.pts.map(function(x){return '<span>'+esc(dlong(x.d))+': <strong>'+x.v+'</strong></span>';}).join('')+'</div></details></div>';
  }).join('')+'<div class="small muted">Se toman de los resultados guardados en Paraclínicos. mg/dL son miligramos por decilitro (1 dL = 100 mL de sangre); g/dL, gramos por decilitro; ×10³/µL, miles de células por microlitro. Los puntos van equidistantes para que no se amontonen; entre cada par se indica cuántos días pasaron (“+3 d”).</div></details>';
}

/* ---------- pacientes compartidos ---------- */
function sStable(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return '['+o.map(sStable).join(',')+']';return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+sStable(o[k]);}).join(',')+'}';}
function sHash(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length;}
function scrubV(v,k){if(typeof v==='string')return k==='id'?v:ptScrub(v);if(Array.isArray(v))return v.map(function(x){return scrubV(x);});if(v&&typeof v==='object'){var o={};Object.keys(v).forEach(function(q){o[q]=scrubV(v[q],q);});return o;}return v;}
var PNOSYNC={rnx:1,hcn:1,hc:1,id:1,serviceId:1,sh:1,demo:1,active:1,exitAt:1};
function shItems(p){
  var it={},o={};Object.keys(p).forEach(function(k){if(!PNOSYNC[k])o[k]=p[k];});it.p=scrubV(o);
  db.entries.forEach(function(e){if(e.patientId!==p.id)return;var c={};Object.keys(e).forEach(function(k){if(k!=='patientId')c[k]=e[k];});it['e:'+e.id]=scrubV(c);});
  db.tasks.forEach(function(t){if(t.patientId!==p.id)return;var c={};Object.keys(t).forEach(function(k){if(k!=='patientId')c[k]=t[k];});it['t:'+t.id]=scrubV(c);});
  return it;
}
function shDiff(p){
  var cur=shItems(p),ch={},now=Date.now(),n=0;
  Object.keys(cur).forEach(function(k){var h=sHash(sStable(cur[k]));if(p.sh.base[k]!==h){ch[k]={v:cur[k],m:now,h:h};n++;}});
  Object.keys(p.sh.base).forEach(function(k){if(!(k in cur)){ch[k]={v:null,m:now,h:''};n++;}});
  return {ch:ch,n:n};
}
function spSet(p,k,v){
  if(k==='p'){if(!v)return;Object.keys(p).forEach(function(f){if(!PNOSYNC[f]&&!(f in v))delete p[f];});Object.keys(v).forEach(function(f){p[f]=v[f];});return;}
  var arr=k.charAt(0)==='e'?db.entries:db.tasks,id=k.slice(2),i=-1;
  arr.forEach(function(x,j){if(x.id===id)i=j;});
  if(v===null){if(i>=0)arr.splice(i,1);return;}
  var o={};Object.keys(v).forEach(function(f){o[f]=v[f];});o.patientId=p.id;
  if(i>=0)arr[i]=o;else arr.push(o);
}
function dbTouch(){db.meta.mod=new Date().toISOString();persist();if(typeof gAuto==='function')gAuto();}
var SP={busy:false,last:0,t:null};
function spAny(){return db.patients.some(function(p){return p.sh&&p.sh.id&&!p.sh.gone;});}
function spAuto(){if(!tAvail()||!spAny())return;clearTimeout(SP.t);SP.t=setTimeout(function(){spSyncAll();},2500);}
function spApply(p,r,d){
  var sh=p.sh,changed=0,by='';
  Object.keys(r.items).forEach(function(k){
    var it=r.items[k],mine=d.ch[k];
    if(mine){
      if(sStable(it.v)===sStable(mine.v)){if(it.v===null)delete sh.base[k];else sh.base[k]=mine.h;return;}
    }else{
      var cur=shItems(p)[k],hc=cur===undefined?undefined:sHash(sStable(cur));
      if(hc!==sh.base[k])return;   /* lo editaste mientras tanto: tu cambio se envía en el siguiente ciclo */
    }
    spSet(p,k,it.v);changed++;by=it.bn||by;
    var nw=shItems(p)[k];if(nw===undefined)delete sh.base[k];else sh.base[k]=sHash(sStable(nw));
  });
  sh.rev=r.rev;
  if(changed)sh.upd={n:((sh.upd&&sh.upd.n)||0)+changed,at:new Date().toISOString(),by:by||(sh.upd&&sh.upd.by)||''};
  return changed;
}
function spBusyEdit(){var a=document.activeElement;return !!(S.editor||S.editPatient||S.newPatient||S.hxEdit||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest&&a.closest('#app')));}
function spSyncAll(){
  if(!tAvail()||SP.busy||!spAny())return Promise.resolve();
  SP.busy=true;SP.last=Date.now();
  var ps=db.patients.filter(function(p){return p.sh&&p.sh.id&&!p.sh.gone;}),sent={};
  var shares=ps.map(function(p){var d=shDiff(p);sent[p.id]=d;var ch={};Object.keys(d.ch).forEach(function(k){ch[k]={v:d.ch[k].v,m:d.ch[k].m};});return {id:p.sh.id,since:p.sh.rev||0,lsince:p.sh.logn||0,changes:ch};});
  return tApi({action:'spSync',shares:shares}).then(function(j){
    var any=0,names=[];
    j.shares.forEach(function(r){
      var p=db.patients.filter(function(x){return x.sh&&x.sh.id===r.id;})[0];if(!p)return;
      if(r.gone){p.sh.gone=1;return;}
      spLog(p,r);
      var n=spApply(p,r,sent[p.id]);if(n){any+=n;names.push(p.ini+(p.sh.upd&&p.sh.upd.by?' ('+p.sh.upd.by+')':''));}
    });
    SP.busy=false;
    if(any){dbTouch();toast('Actualizado: '+names.join(', ')+'.');if(!spBusyEdit())render();}
  }).catch(function(e){SP.busy=false;});
}
function spShare(p){
  if(p.sh&&p.sh.id&&!p.sh.gone)return spSyncAll().then(function(){return p.sh.id;});
  var cur=shItems(p);
  if(JSON.stringify(cur).length>4.2e6)return Promise.reject(new Error('Este paciente tiene demasiada información para compartirlo.'));
  return tApi({action:'spCreate',items:cur}).then(function(j){var base={};Object.keys(cur).forEach(function(k){base[k]=sHash(sStable(cur[k]));});p.sh={id:j.id,base:base,rev:j.rev,upd:null};dbTouch();return j.id;});
}
function spJoin(shareId,serviceId){
  var ex=db.patients.filter(function(x){return x.sh&&x.sh.id===shareId;})[0];
  if(ex)return Promise.reject(new Error('Ya tienes a este paciente en tus servicios.'));
  return tApi({action:'spSync',shares:[{id:shareId,since:0,changes:{}}]}).then(function(j){
    var r=j.shares[0];if(!r||r.gone)throw new Error('Ya no tienes acceso a este paciente.');
    var pv=r.items.p&&r.items.p.v;if(!pv)throw new Error('El paciente compartido está vacío.');
    var p={id:uid(),serviceId:serviceId,active:true};Object.keys(pv).forEach(function(f){p[f]=pv[f];});
    db.patients.push(p);p.sh={id:shareId,base:{},rev:r.rev,upd:null};spLog(p,r);
    Object.keys(r.items).forEach(function(k){if(k!=='p'&&r.items[k].v!==null)spSet(p,k,r.items[k].v);});
    var cur=shItems(p);Object.keys(cur).forEach(function(k){p.sh.base[k]=sHash(sStable(cur[k]));});
    dbTouch();return p;
  });
}
setInterval(function(){
  if(!tAvail()||!spAny()||document.visibilityState!=='visible')return;
  var cp=S.view==='patient'&&S.patientId&&pat(S.patientId),every=(cp&&cp.sh)?6000:20000;
  if(Date.now()-SP.last>=every-300)spSyncAll();
},3000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')spSyncAll();});

    (q.tasks||[]).forEach(function(t){db.tasks.push({id:uid(),patientId:id,text:t,done:false,at:new Date().toISOString()});});
    save();fin();
  });
};

/* ---------- buscador del lobby ---------- */
function gMatch(q){
  q=String(q||'').trim();if(!q)return [];
  var d=q.replace(/\D/g,''),u=q.toUpperCase();
  return db.patients.filter(function(p){
    if(d.length>=3&&d===q.replace(/\s/g,'')&&(String(p.hcn||'').indexOf(d)>=0||(d.length===3&&p.hc===d)))return true;
    if(u.length>=2&&p.ini&&p.ini.toUpperCase().indexOf(u)===0)return true;
    if(String(p.bed||'').toUpperCase()===u)return true;
    return false;
  });
}
function gResHtml(q){
  q=String(q||'').trim();if(!q)return '<div class="small muted">Escribe al menos 3 dígitos del número de historia clínica, o las iniciales, o el número de cama.</div>';
  var r=gMatch(q);
  if(!r.length)return '<div class="small muted">Ningún paciente coincide con “'+esc(q)+'”.</div>';
  return r.map(function(p){var sv=svc(p.serviceId);
    return '<button class="pcard" data-a="openPatient" data-id="'+p.id+'"><div class="row spread"><div class="row"><span class="bed">Cama '+esc(p.bed||'—')+'</span><strong>'+esc(p.ini)+'</strong><span class="muted small">'+esc(p.age)+' a · '+esc(p.sex)+'</span></div><span class="pill '+esc(p.sev)+'">'+esc(p.sev)+'</span></div><div class="small">HC '+esc(p.hcn||(p.hc?'…'+p.hc:'sin número'))+' · '+esc(sv?sv.name:'')+(p.active?'':' · egresado')+'</div><div class="dx">'+esc(p.dx||'Sin diagnóstico')+'</div></button>';
  }).join('');
}

  return '<div class="card"><label>Buscar paciente<input id="gq" type="search" inputmode="search" autocomplete="off" placeholder="Número de historia clínica, iniciales o cama" value="'+esc(S.gq||'')+'"></label><div id="gres" class="cols">'+(S.gq?gResHtml(S.gq):'<div class="small muted">Busca por número de historia clínica (mínimo 3 dígitos), iniciales o cama. El número lo guardas en la ficha de cada paciente y solo lo ves tú.</div>')+'</div></div>'+

}
